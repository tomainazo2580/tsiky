 <link rel="manifest" href="manifest.json">

  .rond { background: #dbeafe; color: #1d4ed8; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; }
  .numero { text-align: center; color: #475569; font-size: 14px; background: #f1f5f9; border-radius: 10px; padding: 8px; margin: 10px 0; }
  .annonce { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-top: 10px; }
  .annonce h3 { font-size: 15px; color: #1e3a8a; }

  .popup { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 330px; position: relative; text-align: center; }
  .popup img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
  .croix { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; color: #334155; font-size: 15px; padding: 0; margin: 0; }

  .bulle.moi { background: #1d4ed8; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bulle img { max-width: 100%; border-radius: 10px; display: block; margin-bottom: 4px; }
  .heure { font-size: 10px; opacity: .7; text-align: right; margin-top: 3px; }
  .barre-envoi { display: flex; gap: 8px; margin-top: 10px; align-items: center; }

  .barre-envoi button { width: auto; margin: 0; padding: 12px 16px; }

  .contact-item img, .contact-item .rond-p { width: 46px; height: 46px; }

  .contact-item .tel2 { font-size: 12px; color: #64748b; }
  .pastille { display: inline-block; min-width: 22px; padding: 2px 7px; margin-left: 6px; border-radius: 99px; background: #dc2626; color: #fff; font-size: 12px; font-weight: 700; text-align: center; }
</style>

<script>
const SUPABASE_URL = "https://arkgysluldvprdxeplur.supabase.co";
const SUPABASE_KEY = "sb_publishable_ObfagnObPZY2qUEGNwKavg_8HWsgMsu";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById("app");
const zonePopup = document.getElementById("zonePopup");
let user = null, monProfil = null, partenaireActuel = null, canal = null;
let nonLus = {};

/* ---------- Outils ---------- */
function normaliserNumero(brut) {
  let n = (brut || "").replace(/[\s.\-()]/g, "");
  if (n.startsWith("+261")) n = n.slice(1);
  else if (n.startsWith("0")) n = "261" + n.slice(1);
  return /^261\d{9}$/.test(n) ? "+" + n : null;
}
const emailInvisible = (num) => num.replace("+", "") + "@tsiky.mg";
const numeroDepuisCompte = () => "+" + (user.email || "").split("@")[0];

function compresserImage(fichier, max = 400) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const e = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * e; c.height = img.height * e;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b), "image/jpeg", 0.8);
    };
    img.src = URL.createObjectURL(fichier);
  });
}

/* ---------- Sonnerie + vibration 🔔 ---------- */
function jouerAlerte() {
  try { if (navigator.vibrate) navigator.vibrate(150); } catch (e) {}
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.setValueAtTime(1175, ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
    o.start(); o.stop(ctx.currentTime + 0.45);
  } catch (e) {}
}

/* ---------- Badges non lus 🔴 ---------- */
function mettreAJourBadges() {
  const total = Object.values(nonLus).reduce((a, b) => a + b, 0);
  const pastille = document.getElementById("pastilleDisc");
  if (pastille) {
    pastille.style.display = total ? "inline-block" : "none";
    pastille.textContent = total;
  }
  document.title = total ? `(${total}) Tsiky 💬` : "Tsiky 💬";
}

async function recalculerNonLus() {
  const { data: recus } = await sb.from("messages")
    .select("sender_id,created_at")
    .eq("receiver_id", user.id)
    .order("created_at", { ascending: false }).limit(500);
  const n = {};
  (recus || []).forEach(m => {
    const vu = localStorage.getItem("tsiky_vu_" + m.sender_id);
    if (!vu || new Date(m.created_at) > new Date(vu)) n[m.sender_id] = (n[m.sender_id] || 0) + 1;
  });
  nonLus = n;
  mettreAJourBadges();
}

function marquerLu(partenaireId) {
  nonLus[partenaireId] = 0;
  localStorage.setItem("tsiky_vu_" + partenaireId, new Date().toISOString());
  mettreAJourBadges();
}

/* ---------- Démarrage ---------- */
(async () => {
  const { data } = await sb.auth.getSession();
  user = data.session?.user ?? null;
  if (user) apresConnexion(); else afficherAuth();
})();

sb.auth.onAuthStateChange((_e, session) => {
  user = session?.user ?? null;
  if (!user) afficherAuth();
});

/* ---------- Écran : numéro + mot de passe ---------- */
function afficherAuth() {
  app.innerHTML = `
    <h1>Tsiky 💬</h1>
    <p class="sous">Le chat léger de Madagascar 🇲🇬</p>
    <label>Ton numéro</label>
    <input id="numero" type="tel" placeholder="034 00 000 00">
    <label>Mot de passe</label>
    <input id="mdp" type="password" placeholder="6 caractères minimum">
    <button id="btnInscrire">Créer mon compte</button>
    <button id="btnConnecter" class="secondaire">J'ai déjà un compte</button>
    <p class="erreur" id="err"></p>`;
  btnInscrire.onclick = () => lancerAuth(true);
  btnConnecter.onclick = () => lancerAuth(false);
}

async function lancerAuth(inscription) {
  const err = document.getElementById("err");
  err.textContent = "";
  const numero = normaliserNumero(document.getElementById("numero").value);
  const mdp = document.getElementById("mdp").value;
  if (!numero) { err.textContent = "Numéro invalide. Exemple : 034 00 000 00"; return; }
  if (mdp.length < 6) { err.textContent = "Mot de passe : 6 caractères minimum."; return; }
  err.textContent = "Un instant…";
  const { error } = inscription
    ? await sb.auth.signUp({ email: emailInvisible(numero), password: mdp })
    : await sb.auth.signInWithPassword({ email: emailInvisible(numero), password: mdp });
  if (error) {
    err.textContent = error.message.includes("Invalid login credentials")
      ? "Numéro ou mot de passe incorrect."
      : error.message.includes("already")
      ? "Ce numéro a déjà un compte. Utilise « J'ai déjà un compte »."
      : error.message;
    return;
  }
  const { data } = await sb.auth.getSession();
  user = data.session?.user;
  apresConnexion();
}

/* ---------- Après connexion ---------- */
async function apresConnexion() {
  const { data: profil } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (!profil) afficherCreationProfil(); else accueil(profil);
}

/* ---------- Écran : création de profil ---------- */
function afficherCreationProfil() {
  let fichier = null;
  app.innerHTML = `
    <h1>Bienvenue !</h1>
    <p class="sous">Ton numéro : ${numeroDepuisCompte()}</p>
    <div class="centre"><span class="rond" id="apercu">+</span></div>
    <input type="file" id="avatar" accept="image/*" hidden>
    <button id="btnPhoto" class="secondaire">📷 Choisir une photo</button>
    <label>Ton pseudo</label>
    <input id="pseudo" placeholder="Ex : Hery">
    <button id="btnOk">C'est parti ✅</button>
    <p class="erreur" id="err"></p>`;
  const inputAvatar = document.getElementById("avatar");
  btnPhoto.onclick = () => inputAvatar.click();
  inputAvatar.onchange = () => {
    fichier = inputAvatar.files[0];
    if (fichier) apercu.outerHTML = `<img class="avatar" id="apercu" src="${URL.createObjectURL(fichier)}">`;
  };
  btnOk.onclick = async () => {
    const err = document.getElementById("err");
    const pseudo = document.getElementById("pseudo").value.trim();
    if (pseudo.length < 2) { err.textContent = "Choisis un pseudo."; return; }
    err.textContent = "Enregistrement…";
    let avatar_url = null;
    if (fichier) {
      const chemin = `${user.id}/avatar.jpg`;
      const { error: errUp } = await sb.storage.from("avatars").upload(chemin, await compresserImage(fichier), { upsert: true });
      if (errUp) { err.textContent = "Photo : " + errUp.message; return; }
      avatar_url = sb.storage.from("avatars").getPublicUrl(chemin).data.publicUrl;
    }
    const { error } = await sb.from("profiles").insert({ id: user.id, pseudo, phone: numeroDepuisCompte(), avatar_url });
    if (error) { err.textContent = error.message; return; }
    accueil({ pseudo, phone: numeroDepuisCompte(), avatar_url, role: "user" });
  };
}

/* ---------- Temps réel ---------- */
function demarrerTempsReel() {
  if (canal) return;
  canal = sb.channel("tsiky-live")
    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "messages", filter: "receiver_id=eq." + user.id },
      (p) => {
        const m = p.new;
        if (partenaireActuel && m.sender_id === partenaireActuel.id) {
          ajouterBulle(m);
          defilerBas();
          marquerLu(m.sender_id);
        } else {
          nonLus[m.sender_id] = (nonLus[m.sender_id] || 0) + 1;
          jouerAlerte();
          mettreAJourBadges();
          if (document.getElementById("listeDisc")) afficherDiscussions();
        }
      })
    .subscribe();
}

/* ---------- Accueil ---------- */
function accueil(profil) {
  monProfil = profil;
  partenaireActuel = null;
  demarrerTempsReel();
  app.innerHTML = `
    <div class="centre">${profil.avatar_url ? `<img class="avatar" src="${profil.avatar_url}">` : `<span class="rond">${profil.pseudo[0].toUpperCase()}</span>`}</div>
    <h1>Salama, ${profil.pseudo} ! 🎉</h1>
    <div class="numero">📱 Ton numéro : ${profil.phone || numeroDepuisCompte()}<br>Donne-le à tes amis pour qu'ils te trouvent !</div>
    <button id="btnDisc">💬 Mes discussions <span class="pastille" id="pastilleDisc" style="display:none"></span></button>
    <button id="btnNouvelle" class="secondaire">➕ Nouvelle discussion</button>
    ${profil.role === "admin" ? `<button id="btnAdmin" class="secondaire">⚙️ Espace admin</button>` : ""}
    <button id="deco" class="secondaire">Se déconnecter</button>`;
  btnDisc.onclick = afficherDiscussions;
  btnNouvelle.onclick = afficherNouveauContact;
  if (profil.role === "admin") btnAdmin.onclick = afficherAdmin;
  deco.onclick = async () => {
    if (canal) { await sb.removeChannel(canal); canal = null; }
    sb.auth.signOut();
  };
  verifierAnnonce();
  recalculerNonLus();
}

/* ---------- Liste des discussions ---------- */
async function afficherDiscussions() {
  partenaireActuel = null;
  app.innerHTML = `
    <div class="entete"><button class="retour" id="retourAcc">←</button><span class="nom">Mes discussions</span></div>
    <div id="listeDisc"><p style="color:#64748b;font-size:14px;text-align:center;margin-top:20px">Chargement…</p></div>
    <button id="btnNouveau">➕ Nouvelle discussion</button>`;
  retourAcc.onclick = () => accueil(monProfil);
  btnNouveau.onclick = afficherNouveauContact;
  await recalculerNonLus();
  const { data: msgs } = await sb.from("messages")
    .select("sender_id,receiver_id,created_at")
    .or("sender_id.eq." + user.id + ",receiver_id.eq." + user.id)
    .order("created_at", { ascending: false });
  const ordre = [], vus = new Set();
  (msgs || []).forEach(m => {
    const pid = m.sender_id === user.id ? m.receiver_id : m.sender_id;
    if (!vus.has(pid)) { vus.add(pid); ordre.push(pid); }
  });
  const cont = document.getElementById("listeDisc");
  if (!ordre.length) {
    cont.innerHTML = `<p style="color:#64748b;font-size:14px;text-align:center;margin:20px 0">Aucune discussion.<br>Commence par un contact ! 👇</p>`;
    return;
  }
  const { data: profs } = await sb.from("profiles").select("*").in("id", ordre);
  cont.innerHTML = "";
  ordre.forEach(pid => {
    const p = (profs || []).find(x => x.id === pid);
    if (!p) return;
    const div = document.createElement("div");
    div.className = "contact-item";
    div.innerHTML = `
      ${p.avatar_url ? `<img src="${p.avatar_url}">` : `<span class="rond-p">${p.pseudo[0].toUpperCase()}</span>`}
      <div class="infos"><div class="nom2">${p.pseudo}</div><div class="tel2">${p.phone || ""}</div></div>
      ${nonLus[p.id] ? `<span class="pastille">${nonLus[p.id]}</span>` : ""}`;
    div.onclick = () => ouvrirConversation(p);
    cont.appendChild(div);
  });
}

/* ---------- Nouveau contact ---------- */
function afficherNouveauContact() {
  app.innerHTML = `
    <div class="entete"><button class="retour" id="retourAcc">←</button><span class="nom">Nouvelle discussion</span></div>
    <label>Numéro de ton ami</label>
    <input id="numAmi" type="tel" placeholder="034 00 000 00">
    <button id="btnChercher">🔍 Chercher</button>
    <p class="erreur" id="err"></p>`;
  retourAcc.onclick = () => accueil(monProfil);
  btnChercher.onclick = async () => {
    const err = document.getElementById("err");
    err.textContent = "";
    const num = normaliserNumero(document.getElementById("numAmi").value);
    if (!num) { err.textContent = "Numéro invalide. Exemple : 034 00 000 00"; return; }
    if (num === monProfil.phone) { err.textContent = "C'est ton propre numéro 😄"; return; }
    err.textContent = "Recherche…";
    const { data: p } = await sb.from("profiles").select("*").eq("phone", num).maybeSingle();
    if (!p) { err.textContent = "Aucun compte Tsiky avec ce numéro. Dis-lui de s'inscrire !"; return; }
    ouvrirConversation(p);
  };
}

/* ---------- Conversation ---------- */
async function ouvrirConversation(partenaire) {
  partenaireActuel = partenaire;
  const { data: bloc } = await sb.from("blocks").select("*")
    .eq("blocker_id", user.id).eq("blocked_id", partenaire.id).maybeSingle();
  const bloque = !!bloc;
  app.innerHTML = `
    <div class="entete">
      <button class="retour" id="retourDisc">←</button>
      ${partenaire.avatar_url ? `<img src="${partenaire.avatar_url}">` : `<span class="rond-p">${partenaire.pseudo[0].toUpperCase()}</span>`}
      <span class="nom">${partenaire.pseudo}</span>
      <button class="retour" id="btnBloc" title="Bloquer">${bloque ? "✅" : "🚫"}</button>
    </div>
    <div class="zone-msgs" id="zoneMsgs"><p style="color:#94a3b8;font-size:13px;text-align:center">Chargement…</p></div>
    ${bloque
      ? `<p class="erreur">Tu as bloqué ce contact. Débloque-le (✅) pour discuter.</p>`
      : `<div class="barre-envoi">
          <input id="txtMsg" placeholder="Écris ton message…">
          <button id="btnPhotoM" title="Photo">📷</button>
          <button id="btnEnvoyer">➤</button>
        </div>
        <input type="file" id="fichierMsg" accept="image/*" hidden>
        <p class="erreur" id="errMsg"></p>`}`;
  retourDisc.onclick = afficherDiscussions;
  btnBloc.onclick = async () => {
    if (bloque) {
      await sb.from("blocks").delete().eq("blocker_id", user.id).eq("blocked_id", partenaire.id);
    } else {
      if (!confirm("Bloquer " + partenaire.pseudo + " ? Il ne pourra plus t'écrire.")) return;
      await sb.from("blocks").insert({ blocker_id: user.id, blocked_id: partenaire.id });
    }
    ouvrirConversation(partenaire);
  };
  if (bloque) return;
  const { data: msgs } = await sb.from("messages").select("*")
    .or("and(sender_id.eq." + user.id + ",receiver_id.eq." + partenaire.id + "),and(sender_id.eq." + partenaire.id + ",receiver_id.eq." + user.id + ")")
    .order("created_at");
  document.getElementById("zoneMsgs").innerHTML = "";
  (msgs || []).forEach(ajouterBulle);
  defilerBas();
  marquerLu(partenaire.id);
  btnEnvoyer.onclick = envoyerTexte;
  txtMsg.addEventListener("keydown", e => { if (e.key === "Enter") envoyerTexte(); });
  btnPhotoM.onclick = () => fichierMsg.click();
  fichierMsg.onchange = envoyerPhoto;
}

function ajouterBulle(m) {
  const zone = document.getElementById("zoneMsgs");
  if (!zone) return;
  const div = document.createElement("div");
  div.className = "bulle " + (m.sender_id === user.id ? "moi" : "autre");
  const h = new Date(m.created_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  let c = "";
  if (m.media_type === "image" && m.media_url) c += `<img src="${m.media_url}">`;
  if (m.content) c += `<div>${m.content.replace(/</g, "&lt;")}</div>`;
  c += `<div class="heure">${h}</div>`;
  div.innerHTML = c;
  zone.appendChild(div);
}

function defilerBas() {
  const zone = document.getElementById("zoneMsgs");
  if (zone) zone.scrollTop = zone.scrollHeight;
}

async function envoyerTexte() {
  const txt = document.getElementById("txtMsg");
  const err = document.getElementById("errMsg");
  const contenu = txt.value.trim();
  if (!contenu) return;
  txt.value = "";
  const { data, error } = await sb.from("messages").insert({
    sender_id: user.id, receiver_id: partenaireActuel.id, content: contenu
  }).select().single();
  if (error) { err.textContent = "Impossible d'envoyer — ce contact t'a peut-être bloqué."; return; }
  ajouterBulle(data);
  defilerBas();
}

async function envoyerPhoto() {
  const f = document.getElementById("fichierMsg").files[0];
  const err = document.getElementById("errMsg");
  if (!f) return;
  err.textContent = "Envoi de la photo…";
  const chemin = user.id + "/msg_" + Date.now() + ".jpg";
  const { error: errUp } = await sb.storage.from("fichiers")
    .upload(chemin, await compresserImage(f, 800));
  if (errUp) { err.textContent = "Photo : " + errUp.message; return; }
  const url = sb.storage.from("fichiers").getPublicUrl(chemin).data.publicUrl;
  const { data, error } = await sb.from("messages").insert({
    sender_id: user.id, receiver_id: partenaireActuel.id, media_url: url, media_type: "image"
  }).select().single();
  if (error) { err.textContent = "Impossible d'envoyer."; return; }
  err.textContent = "";
  ajouterBulle(data);
  defilerBas();
}

/* ---------- Popup pub (1 fois par jour max) ---------- */
async function verifierAnnonce() {
  const { data } = await sb.from("annonces").select("*").eq("actif", true)
    .order("created_at", { ascending: false }).limit(1);
  if (!data || !data.length) return;
  const a = data[0];
  const vu = JSON.parse(localStorage.getItem("tsiky_pub_vu") || "{}");
  if (vu.id === a.id && vu.jour === new Date().toDateString()) return;
  zonePopup.innerHTML = `
    <div class="voile">
      <div class="popup">
        <button class="croix" id="fermerPub">✕</button>
        ${a.image_url ? `<img src="${a.image_url}">` : ""}
        <h2>${a.titre}</h2>
        <p style="color:#334155;font-size:15px;margin:8px 0 12px">${a.message}</p>
        ${a.lien ? `<button id="btnLien">Découvrir 🔗</button>` : ""}
      </div>
    </div>`;
  fermerPub.onclick = () => {
    zonePopup.innerHTML = "";
    localStorage.setItem("tsiky_pub_vu", JSON.stringify({ id: a.id, jour: new Date().toDateString() }));
  };
  if (a.lien) btnLien.onclick = () => window.open(a.lien, "_blank");
}

/* ---------- Espace admin ---------- */
function afficherAdmin() {
  app.innerHTML = `
    <h1>⚙️ Admin</h1>
    <p class="sous">Crée et gère tes annonces</p>
    <label>Titre</label>
    <input id="aTitre" placeholder="Ex : Découvre Namako !">
    <label>Message</label>
    <textarea id="aMessage" placeholder="Révise plus intelligemment pour le BEPC…"></textarea>
    <label>Image (optionnel)</label>
    <input id="aImage" type="file" accept="image/*">
    <label>Lien à ouvrir (optionnel)</label>
    <input id="aLien" type="url" placeholder="https://namako.workers.dev">
    <button id="btnPublier">📢 Publier l'annonce</button>
    <p class="erreur" id="err"></p>
    <p class="info" id="ok"></p>
    <h2>Annonces existantes</h2>
    <div id="liste"><p style="color:#64748b;font-size:14px">Chargement…</p></div>
    <button id="retour" class="secondaire">← Retour</button>`;
  btnPublier.onclick = publierAnnonce;
  retour.onclick = () => accueil(monProfil);
  chargerListe();
}

async function publierAnnonce() {
  const err = document.getElementById("err");
  const titre = aTitre.value.trim(), message = aMessage.value.trim();
  if (!titre || !message) { err.textContent = "Titre et message obligatoires."; return; }
  err.textContent = "Publication…";
  let image_url = null;
  if (aImage.files[0]) {
    const chemin = `${user.id}/annonce_${Date.now()}.jpg`;
    const { error: errUp } = await sb.storage.from("pubs").upload(chemin, await compresserImage(aImage.files[0], 600), { upsert: true });
    if (errUp) { err.textContent = "Image : " + errUp.message; return; }
    image_url = sb.storage.from("pubs").getPublicUrl(chemin).data.publicUrl;
  }
  const { error } = await sb.from("annonces").insert({ titre, message, image_url, lien: aLien.value.trim() || null });
  if (error) { err.textContent = error.message; return; }
  document.getElementById("ok").textContent = "Annonce publiée ✅";
  aTitre.value = ""; aMessage.value = ""; aLien.value = ""; aImage.value = "";
  err.textContent = "";
  chargerListe();
}

async function chargerListe() {
  const { data } = await sb.from("annonces").select("*").order("created_at", { ascending: false });
  liste.innerHTML = data?.length ? "" : `<p style="color:#64748b;font-size:14px">Aucune annonce pour l'instant.</p>`;
  data?.forEach(a => {
    const div = document.createElement("div");
    div.className = "annonce";
    div.innerHTML = `
      <h3>${a.titre}</h3>
      <p>${a.message}</p>
      <div class="ligne">
        <span class="badge ${a.actif ? "on" : "off"}">${a.actif ? "ACTIVE" : "MASQUÉE"}</span>
        <button class="mini secondaire" id="tg-${a.id}">${a.actif ? "Masquer" : "Activer"}</button>
        <button class="mini secondaire" id="del-${a.id}">🗑️</button>
      </div>`;
    liste.appendChild(div);
    document.getElementById("tg-" + a.id).onclick = async () => {
      await sb.from("annonces").update({ actif: !a.actif }).eq("id", a.id);
      chargerListe();
    };
    document.getElementById("del-" + a.id).onclick = async () => {
      if (confirm("Supprimer cette annonce ?")) { await sb.from("annonces").delete().eq("id", a.id); chargerListe(); }
    };
  });
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
