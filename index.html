<!-- Tsiky v30.4 — REMPLACE CE FICHIER EN ENTIER sur GitHub (branche main).
     Vérification après publication : le bas de l'app doit afficher « Tsiky v30.4 ».
     v30.4 : NOTIFICATIONS APP FERMÉE + ACCUSÉ DE LECTURE (demande de Binou,
     « comme Facebook et WhatsApp »). 1) NOTIFICATIONS : bouton « 🔔 Notifi-
     cations » sur l'accueil — s'il est activé, un message reçu quand l'app
     est FERMÉE fait vibrer le téléphone et affiche « Tsiky — Pseudo ». Pas
     de serveur : c'est l'EXPÉDITEUR qui sonne le destinataire (chiffrement
     Web Push standard + identité VAPID de Tsiky, clés P-256 en bas de page).
     Si l'app est déjà ouverte à l'écran, aucune notification (comme
     WhatsApp). Nécessite le bloc SQL v30.4 dans Supabase (table
     push_subscriptions) — sans lui, Tsiky marche exactement comme avant.
     2) LU : petit « ✓ » (envoyé) / « ✓✓ » (lu) sous mes messages ; quand
     l'ami ouvre la discussion, le ✓ devient ✓✓ — en direct via le canal
     temps réel déjà présent. Nécessite le même bloc SQL (colonne lu).
     SANS le bloc SQL : tout le reste fonctionne exactement comme v30.3.
     v30.3 : PHOTOS MULTIPLES (demande de Binou) — dans « Joindre un fichier »,
     « Choisir dans la galerie » permet de sélectionner PLUSIEURS photos d'un
     coup (5 maximum, pour ménager les réseaux lents et les forfaits). Chaque
     photo part dans SA bulle, l'une après l'autre, avec un suivi lisible :
     « Photo 2/3 — envoi… essai 1/3 · 42 % ». Une photo qui échoue n'empêche
     PAS les suivantes : à la fin, le message dit exactement laquelle
     réessayer (les autres sont déjà parties). La photo prise avec la caméra
     reste une seule à la fois, comme un vrai appareil photo. Rien à changer
     côté Supabase.
     v30.2 : BOUTONS HARMONISÉS (retour de Binou, captures 15h32) — « Inviter
     un ami » tient sur UNE ligne comme les autres ; menus déroulants (« Où
     la publier ? ») aux mêmes dimensions que les champs.
     v30.1 : FINITIONS DU QUOTIDIEN (choisies avec Binou). 1) « Inviter un ami »
     ouvre une petite fenêtre Tsiky : le message d'invitation est affiché EN
     CLAIR avec un bouton « Copier le message » qui marche PARTOUT — Facebook
     jette le texte pré-écrit quand on partage vers une publication (anti-spam
     de chez eux) ; désormais on copie, on colle soi-même, rien ne se perd.
     2) Sonnerie « discrète mais entendue » (calibrage exact demandé par Binou)
     : double pulsation tuc-tuc + son 2 notes à ~2× le volume d'avant, doux.
     3) Porte de secours MOT DE PASSE : lien « Mot de passe oublié ? » sur
     l'écran de connexion, bouton « Changer mon mot de passe » sur l'accueil
     (chacun change le sien), et pour l'admin une fenêtre de réinitialisation
     (via une petite fonction serveur à déployer UNE fois — le mot de passe
     d'un autre compte ne se change JAMAIS depuis le navigateur).
     4) Discussion PLEINE HAUTEUR (la moitié vide d'en bas disparaît), ligne
     d'écriture agrandie : vraie zone de texte multi-lignes qui grandit toute
     seule, boutons 📎/➤ remplacés par des icônes SVG propres, heure 11px,
     bulles plus aérées.
     v30 : CROISSANCE (objectif : grandir avant la suite de la roadmap).
     1) Bouton « Inviter un ami 🎁 » : 1 touche → la feuille de partage du
     téléphone s'ouvre avec le message d'invitation DÉJÀ ÉCRIT + le lien de
     l'app. Partage système indisponible ? Le message est copié, prêt à
     coller. 2) Badge « ⭐ Membre fondateur · N° x sur 100 » pour les 100
     premiers inscrits (rang calculé sur la date de création du profil ; si
     le calcul échoue, le badge disparaît en silence — jamais de blocage).
     v28 : ENVOIS SUR RÉSEAU DIFFICILE (l'indice du PDF de 2 Mo). 1) PROGRESSION
     RÉELLE pendant l'envoi : « essai 1/3 · 42 % · 0,8/2 Mo » — avant, un simple
     compteur de secondes, impossible de savoir si ça avançait vraiment.
     2) Temps d'envoi ADAPTÉ À LA TAILLE : 45 s + 1 min par Mo au-delà du premier
     (un PDF de 2 Mo dispose de 2 min 45 par essai au lieu de 45 s — sur un
     réseau qui rame, les gros fichiers n'étaient plus condamnés d'avance).
     3) Connexion MORTE détectée en 30 s sans octet passé → réessai immédiat au
     lieu d'attendre la fin du délai. 4) Bouton « Diagnostic » en bas : teste la
     connexion, le serveur, le stockage puis un VRAI envoi de 5 Ko — dit
     précisément où ça bloque (capture d'écran au développeur en cas de souci).
     5) Vérification de nouvelle version au retour sur l'app + chaque minute
     (jamais pendant un envoi) — même laissée ouverte, l'app se met à jour.
     6) Historique plafonné (500 derniers messages par discussion, liste des
     discussions légère) — le téléphone reste rapide après des mois d'usage.
     7) Noms de documents PDF nettoyés (plus d'espaces dans les liens).
     v27 : mise à jour automatique, compression blindée, anti double-envoi,

const SUPABASE_URL = "https://arkgysluldvprdxeplur.supabase.co";
const SUPABASE_KEY = "sb_publishable_ObfagnObPZY2qUEGNwKavg_8HWsgMsu";
/* v26 : filet GLOBAL — toutes les requêtes Supabase (base, auth, stockage) passent
   par ce fetch avec timeout : 30 s pour la base / auth, 75 s pour l'envoi de fichiers.
   Une coupure réseau devient une ERREUR AFFICHÉE au lieu d'un écran figé sans fin. */
function fetchFiable(url, opts) {
  const cible = String(url || "");
  const methode = (opts && opts.method ? String(opts.method) : "GET").toUpperCase();
  const ms = (cible.includes("/storage/v1/object") && methode !== "GET") ? 75000 : 30000;
  return new Promise((resolu, rejette) => {
    const ctrl = new AbortController();
    const minuteur = setTimeout(() => { try { ctrl.abort(); } catch (e2) {} rejette(new Error("timeout réseau")); }, ms);
    fetch(url, Object.assign({}, opts, { signal: ctrl.signal })).then(r => {
      clearTimeout(minuteur); resolu(r);
    }).catch(e => {
      clearTimeout(minuteur); rejette(e || new Error("Failed to fetch"));
    });
  });
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global: { fetch: fetchFiable } });

/* v29 : DERNIER FILET — une erreur inattendue doit s'AFFICHER, jamais tuer
   l'écran en silence (le gel de la v25-v28 sur « essai 1/3 » ne doit plus
   être possible, quel que soit le bug futur). */
function afficherPlantage(msg) {
  try {
    const z = document.getElementById("errMsg") || document.getElementById("err");
    if (z) z.textContent = "Erreur inattendue — réessaie. (" + msg + ")";
  } catch (e2) {}
}
window.addEventListener("unhandledrejection", (e) => {
  afficherPlantage((e.reason && e.reason.message) || String(e.reason));
});
window.addEventListener("error", (e) => {
  if (e && e.message && e.target === window) afficherPlantage(e.message);
});

/* ---------- Outils ---------- */
function normaliserNumero(brut) {
  let n = (brut || "").replace(/[\s.\-()]/g, "");
  if (n.startsWith("+261")) n = n.slice(1);
  else if (n.startsWith("0")) n = "261" + n.slice(1);
  return /^261\d{9}$/.test(n) ? "+" + n : null;
}
const emailInvisible = (num) => num.replace("+", "") + "@tsiky.mg";
const numeroDepuisCompte = () => "+" + (user.email || "").split("@")[0];

/* v27 : compression blindée — toBlob sous son PROPRE timeout (8 s, avant il
   pouvait ne jamais finir sur les petits téléphones), URL libérée après usage,
   et refus CLAIR avant l'envoi si la photo originale dépasse 4 Mo et que la
   compression échoue (avant : on partait quand même vers 45 s × 3 d'attente
   avec une photo brute de 10-15 Mo — ça ressemblait à un figeage). */
function compresserImage(fichier, max = 400) {
  return new Promise((resolve, reject) => {
    const tropLourde = () => reject(new Error("photo trop lourde pour l'envoi — choisis-en une plus petite"));
    const echec = () => (fichier.size > 4 * 1024 * 1024 ? tropLourde() : resolve(fichier));
    const timer = setTimeout(echec, 8000);
    const urlObjet = URL.createObjectURL(fichier);
    const img = new Image();
    img.onload = () => {
      clearTimeout(timer);
      URL.revokeObjectURL(urlObjet);
      try {
        const e = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * e));
        c.height = Math.max(1, Math.round(img.height * e));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const rendu = (b) => {
          if (b && b.size && b.size < fichier.size) resolve(b);
          else echec();
        };
        const miniTimer = setTimeout(() => rendu(null), 8000);
        c.toBlob(b => { clearTimeout(miniTimer); rendu(b); }, "image/jpeg", 0.8);
      } catch (e2) { clearTimeout(timer); echec(); }
    };
    img.onerror = () => { clearTimeout(timer); URL.revokeObjectURL(urlObjet); echec(); };
    img.src = urlObjet;
  });
}

/* ---------- Envoi de fichier avec réessai (4G instable) — v25→v28 ---------- */
/* v25 : rejets réseau rattrapés, timeout par essai, progression affichée.
   v28 : envoi direct en XHR — la SEULE façon d'obtenir une PROGRESSION RÉELLE
   (le fetch utilisé par supabase-js ne donne aucune progression d'envoi).
   Binou voit désormais « essai 1/3 · 42 % · 0,8/2 Mo » bouger octet par octet :
   plus jamais un envoi qui SEMBLE figé alors qu'il travaille. */
function erreurFrancaise(e) {
  const m = (e && e.message ? e.message : String(e || "")).toLowerCase();
  if (m.includes("fetch") || m.includes("network") || m.includes("timeout") || m.includes("abort") || m.includes("load failed") || m.includes("coupé"))
    return "le réseau n'a pas répondu — réessaie dans quelques minutes ou change de réseau (data ↔ WiFi)";
  if (m.includes("row-level") || m.includes("policy") || m.includes("jwt") || m.includes("401") || m.includes("403"))
    return "session expirée — déconnecte-toi puis reconnecte-toi";
  if (m.includes("payload") || m.includes("too large") || m.includes("413"))
    return "photo trop lourde — essaie une plus petite";
  if (m.includes("quota"))
    return "stockage plein — préviens l'admin via « Contact »";
  return (e && e.message) ? e.message : "erreur inconnue";
}

/* v28 : temps d'envoi ADAPTÉ À LA TAILLE du fichier — 45 s de base + 1 minute
   par Mo au-delà du premier, plafond 5 min. Un PDF de 2 Mo dispose ainsi de
   2 min 45 par essai (avant : 45 s fixes — condamné d'avance sur réseau lent). */
function delaiEnvoi(taille) {
  const mo = Math.max(1, Math.ceil((taille || 0) / 1048576));
  return Math.min(300000, 45000 + (mo - 1) * 60000);
}

function uploadAvecDelai(bucket, chemin, contenu, upsert, surProgres) {
  return new Promise((resolu) => {
    sb.auth.getSession().then(({ data }) => {
      const jeton = data && data.session ? data.session.access_token : null;
      if (!jeton) { resolu({ error: new Error("session expirée") }); return; }
      const cible = SUPABASE_URL + "/storage/v1/object/" + bucket + "/" +
        chemin.split("/").map(encodeURIComponent).join("/");
      const xhr = new XMLHttpRequest();
      let fini = false;
      let dernierFlot = Date.now();
      const terminer = (err) => {
        if (fini) return;
        fini = true;
        clearTimeout(minuteur);
        clearInterval(surveillance);
        try { xhr.abort(); } catch (e2) {}
        resolu({ error: err || null });
      };
      const minuteur = setTimeout(() => terminer(new Error("timeout réseau")), delaiEnvoi(contenu && contenu.size));
      /* v28 : connexion MORTE détectée en 30 s sans le moindre octet passé →
         on lâche cet essai tout de suite au lieu d'attendre la fin du délai */
      const surveillance = setInterval(() => {
        if (Date.now() - dernierFlot > 30000) terminer(new Error("envoi bloqué — le réseau ne fait plus passer les données"));
      }, 5000);
      xhr.open("POST", cible, true);
      xhr.setRequestHeader("Authorization", "Bearer " + jeton);
      xhr.setRequestHeader("apikey", SUPABASE_KEY);
      xhr.setRequestHeader("Content-Type", (contenu && contenu.type) || "application/octet-stream");
      if (upsert) xhr.setRequestHeader("x-upsert", "true");
      xhr.upload.onprogress = (ev) => {
        dernierFlot = Date.now();
        if (surProgres && ev.lengthComputable) surProgres(ev.loaded, ev.total);
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) { terminer(null); return; }
        let msg = "erreur " + xhr.status;
        try {
          const j = JSON.parse(xhr.responseText);
          if (j && j.message) msg = j.message;
          else if (j && j.error) msg = j.error;
        } catch (e3) {}
        terminer(new Error(msg));
      };
      xhr.onerror = () => terminer(new Error("Failed to fetch"));
      xhr.onabort = () => terminer(new Error("timeout réseau"));
      xhr.send(contenu);
    }).catch((e) => resolu({ error: e instanceof Error ? e : new Error(String(e)) }));
  });
}

/* v26 : secondes en direct pendant l'envoi — plus jamais un écran qui semble mort.
   v28 : quand la progression réelle est connue, on affiche « 42 % · 0,8/2 Mo »
   à la place des secondes (bien plus parlant qu'un chrono). */
function txtEssai(prefixe, n, s, pct) {
  const suite = pct || (s >= 3 ? s + " s" : "");
  return prefixe + " essai " + n + "/3" + (suite ? " · " + suite : "");
}

async function uploaderFiable(bucket, chemin, contenu, upsert, statut) {
  /* v29 : renvoie TOUJOURS { error } — avant, le succès renvoyait null et les
     5 écrans qui font « const { error } = await uploaderFiable(...) » PLANTAIENT
     sur « Cannot destructure property 'error' of null » : l'envoi RÉUSSISSAIT
     (le fichier partait vraiment) puis l'écran gèlait en silence sur « essai 1/3 ».
     C'était LE bug qui bloquait photo, galerie et PDF depuis la v25. */
  let derniere = null;
  for (let i = 0; i < 3; i++) {
    let tic = null;
    let pctTxt = "";
    if (statut) {
      const debut = Date.now();
      statut(i + 1, 0, "");
      tic = setInterval(() => statut(i + 1, Math.round((Date.now() - debut) / 1000), pctTxt), 1000);
    }
    const { error } = await uploadAvecDelai(bucket, chemin, contenu, upsert, (charges, total) => {
      if (!total) { pctTxt = Math.round(charges / 1024) + " Ko"; return; }
      const pct = Math.round(charges * 100 / total);
      pctTxt = total >= 1048576
        ? pct + " % · " + (charges / 1048576).toFixed(1).replace(".", ",") + "/" + (total / 1048576).toFixed(1).replace(".", ",") + " Mo"
        : pct + " %";
    });
    if (tic) clearInterval(tic);
    if (!error) return { error: null }; /* v29 : plus jamais null nu */
    derniere = error;
    await new Promise(r => setTimeout(r, 1200));
  }
  return { error: derniere }; /* v29 : même forme { error } en cas d'échec */
}

/* ---------- Sonnerie + vibration (v30.1 : « discrète mais entendue ») ----------
   v30 : un « tic » de 0,15 s à 15 % du volume — on le ratait.
   v30.1 (calibrage exact demandé par Binou) : double pulsation tuc-tuc courte
   + le même motif de 2 notes, mais clairement audible (≈ 2× le volume)
   SANS devenir agressif. Ça passe par le volume MÉDIA du téléphone. */
function jouerAlerte() {
  try { if (navigator.vibrate) navigator.vibrate([140, 90, 140]); } catch (e) {}
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.setValueAtTime(1175, ctx.currentTime + 0.14);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.32, ctx.currentTime + 0.03);
    g.gain.setValueAtTime(0.32, ctx.currentTime + 0.20);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
    o.start(); o.stop(ctx.currentTime + 0.55);
  } catch (e) {}
}

/* ---------- Badges non lus ---------- */
function mettreAJourBadges() {
  const total = Object.values(nonLus).reduce((a, b) => a + b, 0);
  const pastille = document.getElementById("pastilleDisc");
  if (pastille) {
    pastille.style.display = total ? "inline-block" : "none";
    pastille.textContent = total;
  }
  document.title = total ? `(${total}) Tsiky` : "Tsiky";
}

async function recalculerNonLus() {
  const { data: recus } = await sb.from("messages")
    .select("sender_id,created_at")
    .eq("receiver_id", user.id)
    .order("created_at", { ascending: false }).limit(500);
  const n = {};
  (recus || []).forEach(m => {
    const vu = localStorage.getItem("tsiky_vu_" + m.sender_id);
    if (!vu || new Date(m.created_at) > new Date(vu)) n[m.sender_id] = (n[m.sender_id] || 0) + 1;
  });
  nonLus = n;
  mettreAJourBadges();
}

function marquerLu(partenaireId) {
  nonLus[partenaireId] = 0;
  localStorage.setItem("tsiky_vu_" + partenaireId, new Date().toISOString());
  mettreAJourBadges();
  /* v30.4 : accusé de lecture — noté en base, en silence. Si le bloc SQL
     n'est pas encore collé, l'update échoue sans bruit : Tsiky marche
     exactement comme avant, il n'y a juste pas encore de « ✓✓ ». */
  sb.from("messages").update({ lu: true })
    .eq("receiver_id", user.id).eq("sender_id", partenaireId).neq("lu", true)
    .then(() => {}, () => {});
}

/* ---------- v30.1 : porte de secours MOT DE PASSE ----------
   Les comptes Tsiky n'ont pas d'e-mail réel (adresse technique 261…@tsiky.mg),
   donc PAS de lien de réinitialisation par e-mail possible. La porte de
   secours, c'est l'humain — trois étages :
   1) ici : le membre sait exactement quoi faire ;
   2) sur l'accueil : chacun change son propre mot de passe (session ouverte) ;
   3) Espace admin : Binou remet un mot de passe à un membre via une petite
      fonction serveur (le mot de passe d'un AUTRE compte ne se change jamais
      depuis le navigateur — règle de sécurité Supabase). */
function fenetreOubli() {
  const v = document.createElement("div");

      <p style="font-size:13px;color:var(--texte2);line-height:1.55;margin-top:8px">Ensuite, connecte-toi avec ce mot de passe puis change-le depuis l'accueil avec « Changer mon mot de passe ».</p>

/* v30.1 : chacun change SON mot de passe — 100 % côté client, la session
   ouverte donne le droit. Utile après un reset de l'admin, ou juste par prudence. */
function fenetreChangerMdp() {
  const v = document.createElement("div");
  v.className = "voile";
  v.innerHTML = `
    <div class="popup" style="text-align:left">
      <button class="croix" id="mpFermer">✕</button>
      <h2 style="margin-bottom:6px">Changer mon mot de passe</h2>
      <label>Nouveau mot de passe</label>
      <input id="mp1" type="password" placeholder="6 caractères minimum">
      <label>Répète-le une fois</label>
      <input id="mp2" type="password" placeholder="Le même encore">
      <button id="mpOk">Enregistrer</button>
      <p class="erreur" id="mpErr"></p>
    </div>`;
  document.body.appendChild(v);
  document.getElementById("mpFermer").onclick = () => v.remove();
  document.getElementById("mpOk").onclick = async () => {
    const err = document.getElementById("mpErr");
    const a = document.getElementById("mp1").value;
    const b = document.getElementById("mp2").value;
    if (a.length < 6) { err.textContent = "Mot de passe : 6 caractères minimum."; return; }
    if (a !== b) { err.textContent = "Les deux mots de passe ne sont pas identiques."; return; }
    err.textContent = "Enregistrement…";
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) { err.textContent = erreurFrancaise(error); return; }
    v.remove();
    alert("Mot de passe changé ! Retiens-le bien 🙂");
  };
}

async function lancerAuth(inscription) {
  const err = document.getElementById("err");
  err.textContent = "";
  const numero = normaliserNumero(document.getElementById("numero").value);
  const mdp = document.getElementById("mdp").value;
  if (!numero) { err.textContent = "Numéro invalide. Exemple : 034 00 000 00"; return; }
  if (mdp.length < 6) { err.textContent = "Mot de passe : 6 caractères minimum."; return; }
  err.textContent = "Un instant…";
  let resultat;
  try {
    resultat = inscription
      ? await sb.auth.signUp({ email: emailInvisible(numero), password: mdp })
      : await sb.auth.signInWithPassword({ email: emailInvisible(numero), password: mdp });
  } catch (e) { err.textContent = erreurFrancaise(e); return; }
  const error = resultat.error;
  if (error) {
    err.textContent = error.message.includes("Invalid login credentials")
      ? "Numéro ou mot de passe incorrect."
      : error.message.includes("already")
      ? "Ce numéro a déjà un compte. Utilise « J'ai déjà un compte »."
      : error.message;
    return;
  }
  /* v27 : si la confirmation par e-mail était activée côté Supabase, l'inscription
     ne renvoie PAS de session — on l'explique au lieu de planter plus loin */
  if (inscription && (!resultat.data || !resultat.data.session)) {
    err.textContent = "Compte créé ! Appuie maintenant sur « J'ai déjà un compte » pour te connecter.";
    return;
  }
  const { data } = await sb.auth.getSession();
  user = data.session?.user;
  if (!user) { err.textContent = "Connexion impossible pour le moment — réessaie."; return; }
  apresConnexion();
}

/* ---------- Après connexion ---------- */
async function apresConnexion() {
  const { data: profil, error: errProfil } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (errProfil) {
    alert("Connexion : " + erreurFrancaise(errProfil));
    afficherAuth(); majFooter(); /* v27 : jamais d'écran bloqué sur « Chargement… » */
    return;
  }
  if (!profil) afficherCreationProfil(); else accueil(profil);
  majFooter();
}

/* ---------- Écran : création de profil ---------- */
function afficherCreationProfil() {
  let fichier = null;
  app.innerHTML = `
    <h1>Bienvenue !</h1>
    <p class="sous">Ton numéro : ${numeroDepuisCompte()}</p>
    <div class="centre"><span class="rond" id="apercu">+</span></div>
    <input type="file" id="avatar" accept="image/*" hidden>
    <button id="btnPhoto" class="secondaire">Choisir une photo</button>
    <label>Ton pseudo</label>
    <input id="pseudo" placeholder="Ex : Hery">
    <button id="btnOk">C'est parti</button>
    <p class="erreur" id="err"></p>`;
  const inputAvatar = document.getElementById("avatar");
  btnPhoto.onclick = () => inputAvatar.click();
  inputAvatar.onchange = () => {
    fichier = inputAvatar.files[0];
    if (fichier) apercu.outerHTML = `<img class="avatar" id="apercu" src="${URL.createObjectURL(fichier)}">`;
  };
  btnOk.onclick = async () => {
    const err = document.getElementById("err");
    const pseudo = document.getElementById("pseudo").value.trim();
    if (pseudo.length < 2) { err.textContent = "Choisis un pseudo."; return; }
    err.textContent = "Enregistrement…";
    let avatar_url = null;
    if (fichier) {
      const chemin = `${user.id}/avatar.jpg`;
      err.textContent = "Compression de la photo…";
      let contenuAvatar = null;
      try { contenuAvatar = await compresserImage(fichier); }
      catch (e) { err.textContent = erreurFrancaise(e); return; }
      const { error: errUp } = await uploaderFiable("avatars", chemin, contenuAvatar, true, (n, s, pct) => { err.textContent = txtEssai("Envoi de la photo…", n, s, pct); });
      if (errUp) { err.textContent = "Photo : " + erreurFrancaise(errUp); return; }
      avatar_url = sb.storage.from("avatars").getPublicUrl(chemin).data.publicUrl;
    }
    const { error } = await sb.from("profiles").insert({ id: user.id, pseudo, phone: numeroDepuisCompte(), avatar_url });
    if (error) { err.textContent = erreurFrancaise(error); return; }
    accueil({ pseudo, phone: numeroDepuisCompte(), avatar_url, role: "user" });
  };
}

/* ---------- v30.4 : NOTIFICATIONS APP FERMÉE (Web Push) ----------
   Sans serveur : quand j'envoie un message, MON téléphone signe et chiffre
   l'alerte destinée à l'ami (standard Web Push RFC 8291 + identité VAPID).
   Si l'app de l'ami est fermée, son service worker affiche la notification
   « Tsiky — Pseudo ». Si elle est déjà ouverte à l'écran, rien (comme
   WhatsApp). Tout est silencieux : le moindre raté ne gêne JAMAIS l'envoi. */
const VAPID_PUB = "BKURY3ZUblYHeFFrfIYCrorebtspxkxlcHaFtst1jKSjAq_5ysbjha-Dud0seMUMbDnN4b4CiJF1EvxD_a70lNc";
const VAPID_PRIV_JWK = { crv: "P-256", d: "6HO09GfwnoG8P-1gNmJFgPxs0z5WGyGAZyzBenW8I3E", x: "pRFjdlRuVgd4UWt8hgKuit5u2ynGTGVwdoW2y3WMpKM", y: "Aq_5ysbjha-Dud0seMUMbDnN4b4CiJF1EvxD_a70lNc", kty: "EC" };

function b64urlVersOctets(s) {
  const b = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
function octetsVersB64url(o) {
  return btoa(String.fromCharCode(...new Uint8Array(o))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

/* Chiffre le corps du message pour CET abonné (aes128gcm, RFC 8291) */
async function pushChiffrer(plain, p256dh, auth) {
  const cleRecu = await crypto.subtle.importKey("raw", b64urlVersOctets(p256dh), { name: "ECDH", namedCurve: "P-256" }, false, []);
  const eph = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  const partage = await crypto.subtle.deriveBits({ name: "ECDH", public: cleRecu }, eph.privateKey, 256);
  const pubRecu = b64urlVersOctets(p256dh);
  const pubEph = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
  const ikm = await crypto.subtle.importKey("raw", partage, "HKDF", false, ["deriveBits"]);
  const infoIkm = new Uint8Array(13 + 1 + 65 + 65);
  infoIkm.set(new TextEncoder().encode("WebPush: info"), 0);
  infoIkm[13] = 0; infoIkm.set(pubRecu, 14); infoIkm.set(pubEph, 79);
  const prkBits = await crypto.subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt: b64urlVersOctets(auth), info: infoIkm }, ikm, 256);
  const sel = crypto.getRandomValues(new Uint8Array(16));
  const prk = await crypto.subtle.importKey("raw", prkBits, "HKDF", false, ["deriveBits"]);
  const cek = new Uint8Array(await crypto.subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt: sel, info: new Uint8Array([67, 111, 110, 116, 101, 110, 116, 45, 69, 110, 99, 111, 100, 105, 110, 103, 58, 32, 97, 101, 115, 49, 50, 56, 103, 99, 109, 0]) }, prk, 128));
  const nonce = new Uint8Array(await crypto.subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt: sel, info: new Uint8Array([67, 111, 110, 116, 101, 110, 116, 45, 69, 110, 99, 111, 100, 105, 110, 103, 58, 32, 110, 111, 110, 99, 101, 0]) }, prk, 96));
  const clair = new Uint8Array(plain.length + 1);
  clair.set(plain, 0); clair[plain.length] = 2;
  const cleAes = await crypto.subtle.importKey("raw", cek, "AES-GCM", false, ["encrypt"]);
  const chiffre = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: nonce, tagLength: 128 }, cleAes, clair));
  const corps = new Uint8Array(16 + 4 + 1 + 65 + chiffre.length);
  corps.set(sel, 0);
  corps[16] = 0; corps[17] = 0; corps[18] = 16; corps[19] = 0;
  corps[20] = 65;
  corps.set(pubEph, 21);
  corps.set(chiffre, 86);
  return corps;
}

/* Signe l'identité VAPID (ES256) pour le serveur de push de l'ami */
async function pushJWT(endpoint) {
  const aud = new URL(endpoint).origin;
  const cle = await crypto.subtle.importKey("jwk", VAPID_PRIV_JWK, { name: "ECDSA", namedCurve: "P-256" }, false, ["sign"]);
  const tete = octetsVersB64url(new TextEncoder().encode(JSON.stringify({ typ: "JWT", alg: "ES256" })));
  const corpsJwt = octetsVersB64url(new TextEncoder().encode(JSON.stringify({ aud, exp: Math.floor(Date.now() / 1000) + 43200, sub: "mailto:admin@tsiky.mg" })));
  const sigBrute = new Uint8Array(await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, cle, new TextEncoder().encode(tete + "." + corpsJwt)));
  const sig = new Uint8Array(64);
  sig.set(sigBrute.slice(0, 32), 0);
  sig.set(sigBrute.slice(32, 64), 32);
  return tete + "." + corpsJwt + "." + octetsVersB64url(sig);
}

/* Prévient tous les téléphones d'un membre — jamais d'erreur visible */
async function envoyerPush(destinataireId, corps) {
  try {
    if (!user || destinataireId === user.id) return;
    const { data: subs, error } = await sb.from("push_subscriptions").select("*").eq("user_id", destinataireId);
    if (error || !subs || !subs.length) return;
    await Promise.all(subs.map(async (s) => {
      try {
        const jwt = await pushJWT(s.endpoint);
        const charge = await pushChiffrer(new TextEncoder().encode(JSON.stringify(corps)), s.p256dh, s.auth);
        const r = await fetchFiableURL(s.endpoint, jwt, charge);
        if (r === 404 || r === 410) sb.from("push_subscriptions").delete().eq("id", s.id).then(() => {}, () => {});
      } catch (e) { /* silence : une notif ratée ne doit rien casser */ }
    }));
  } catch (e) { /* silence */ }
}

async function fetchFiableURL(url, jwt, corps) {
  const ctrl = new AbortController();
  const fin = setTimeout(() => ctrl.abort(), 15000);
  try {
    const r = await fetch(url, { method: "POST", headers: { TTL: "86400", Urgency: "high", "Content-Encoding": "aes128gcm", "Content-Type": "application/octet-stream", Authorization: "vapid t=" + jwt + ", k=" + VAPID_PUB }, body: corps, signal: ctrl.signal });
    return r.status;
  } finally { clearTimeout(fin); }
}

async function majEtatNotif() {
  const b = document.getElementById("btnNotif");
  if (!b) return;
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    b.textContent = "🔔 Notifications (non disponible ici)";

      b.textContent = sous ? "🔔 Notifications activées ✓" : "🔔 Notifications";

  };
}

/* ---------- v30.1 : Inviter un ami — la fenêtre ANTI-FACEBOOK ----------
   Constat de terrain (v30) : partagé vers Facebook, le message pré-écrit est
   JETÉ et Facebook ouvre un composeur de PUBLICATION (leur anti-spam : seul
   l'URL passe). Tsiky ne peut pas forcer Facebook. Solution : le message est
   affiché EN CLAIR avec un bouton COPIER qui marche partout — sur Facebook on
   colle soi-même, par SMS/Messenger tout part déjà écrit. Plus de perte. */
const TEXTE_INVITATION = "Salama ! Je t'invite sur Tsiky 🇲🇬 — la messagerie malgache légère : messages, photos, 0 crédit SMS. Installe-la ici : ";
async function copierTexte(texte) {
  try { await navigator.clipboard.writeText(texte); return true; } catch (e) {}
  try {
    const z = document.createElement("textarea");
    z.value = texte;
    z.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(z);
    z.focus(); z.select();
    const bon = document.execCommand("copy");
    z.remove();
    return bon;
  } catch (e2) { return false; }
}

  await recalculerNonLus();
  /* v28 : plafond 2000 messages récents — la liste reste légère après des mois */
  const { data: msgs, error: errMsgs } = await sb.from("messages")
    .select("sender_id,receiver_id,created_at")
    .or("sender_id.eq." + user.id + ",receiver_id.eq." + user.id)
    .order("created_at", { ascending: false }).limit(2000);
  const ordre = [], vus = new Set();
  (msgs || []).forEach(m => {
    const pid = m.sender_id === user.id ? m.receiver_id : m.sender_id;
    if (!vus.has(pid)) { vus.add(pid); ordre.push(pid); }
  });
  const cont = document.getElementById("listeDisc");
  if (!cont) return;
  if (errMsgs) {
    cont.innerHTML = `<p style="color:var(--erreur);font-size:14px;text-align:center;margin:20px 0">Impossible de charger tes discussions — ${erreurFrancaise(errMsgs)}</p>`;
    return;
  }
  if (!ordre.length) {
    cont.innerHTML = `<p style="color:var(--texte2);font-size:14px;text-align:center;margin:20px 0">Aucune discussion.<br>Commence par un contact !</p>`;
    return;
  }
  const { data: profs, error: errProfs } = await sb.from("profiles").select("*").in("id", ordre);
  if (errProfs) {
    cont.innerHTML = `<p style="color:var(--erreur);font-size:14px;text-align:center;margin:20px 0">Impossible de charger les profils — ${erreurFrancaise(errProfs)}</p>`;
    return;
  }
  cont.innerHTML = "";
  ordre.forEach(pid => {
    const p = (profs || []).find(x => x.id === pid);
    if (!p) return;
    const div = document.createElement("div");
    div.className = "contact-item";
    div.innerHTML = `
      ${p.avatar_url ? `<img src="${p.avatar_url}">` : `<span class="rond-p">${(p.pseudo || "?")[0].toUpperCase()}</span>`}
      <div class="infos"><div class="nom2">${p.pseudo}</div><div class="tel2">${p.phone || ""}</div></div>
      ${nonLus[p.id] ? `<span class="pastille">${nonLus[p.id]}</span>` : ""}`;
    div.onclick = () => ouvrirConversation(p);
    cont.appendChild(div);
    if (p.avatar_url) {
      const im = div.querySelector("img");
      if (im) { im.className = "clicPhoto"; im.onclick = (e) => { e.stopPropagation(); zoomPhoto(p.avatar_url); }; }
    }
  });
}

/* ---------- Conversation ---------- */
async function ouvrirConversation(partenaire) {
  partenaireActuel = partenaire;
  const { data: bloc, error: errBloc } = await sb.from("blocks").select("*")
    .eq("blocker_id", user.id).eq("blocked_id", partenaire.id).maybeSingle();
  const bloque = !errBloc && !!bloc;
  app.innerHTML = `
    <div class="entete">
      <button class="retour" id="retourDisc">←</button>
      ${partenaire.avatar_url ? `<img class="clicPhoto" id="avatarPair" src="${partenaire.avatar_url}" title="Agrandir">` : `<span class="rond-p">${(partenaire.pseudo || "?")[0].toUpperCase()}</span>`}
      <span class="nom">${partenaire.pseudo}</span>
      <button class="btnBloc" id="btnBloc" title="Bloquer">${bloque ? "✅" : "🚫"}</button>
    </div>
    <div class="zone-msgs" id="zoneMsgs"><p style="color:var(--texte2);font-size:13px;text-align:center">Chargement…</p></div>
    ${bloque
      ? `<p class="erreur">Tu as bloqué ce contact. Débloque-le (bouton vert) pour discuter.</p>`
      : `<div class="barre-envoi">
          <textarea id="txtMsg" rows="1" placeholder="Écris ton message…"></textarea>
          <button id="btnPJ" class="secondaire" title="Joindre un fichier" aria-label="Joindre un fichier"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
          <button id="btnEnvoyer" title="Envoyer" aria-label="Envoyer"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
        </div>
        <input type="file" id="fichierMsg" accept="image/*" multiple hidden>
        <input type="file" id="fichierCam" accept="image/*" capture="environment" hidden>
        <input type="file" id="fichierDoc" accept="application/pdf,.pdf" hidden>
        <p class="erreur" id="errMsg"></p>`}`;
  retourDisc.onclick = afficherDiscussions;
  if (partenaire.avatar_url) document.getElementById("avatarPair").onclick = () => zoomPhoto(partenaire.avatar_url);
  btnBloc.onclick = async () => {
    let errBloc2 = null; /* v28 : un blocage raté n'est plus silencieux */
    if (bloque) {
      const r = await sb.from("blocks").delete().eq("blocker_id", user.id).eq("blocked_id", partenaire.id);
      errBloc2 = r.error;
    } else {
      if (!confirm("Bloquer " + partenaire.pseudo + " ? Il ne pourra plus t'écrire.")) return;
      const r = await sb.from("blocks").insert({ blocker_id: user.id, blocked_id: partenaire.id });
      errBloc2 = r.error;
    }
    if (errBloc2) { alert("Impossible : " + erreurFrancaise(errBloc2)); return; }
    ouvrirConversation(partenaire);
  };
  if (bloque) return;
  /* v27 : les boutons d'envoi sont branchés AVANT le chargement de l'historique —
     même si l'historique échoue, on peut toujours écrire */
  btnEnvoyer.onclick = envoyerTexte;
  /* v30.1 : la ligne d'écriture est une vraie zone de texte multi-lignes —
     sur ordinateur Enter envoie (Shift+Enter = nouvelle ligne) ; sur téléphone
     Enter fait une nouvelle ligne et on envoie avec le bouton ➤. La zone
     grandit toute seule jusqu'à ~5 lignes, puis le texte défile dedans. */
  txtMsg.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(min-width: 700px)").matches) {
      e.preventDefault();
      envoyerTexte();
    }
  });
  txtMsg.addEventListener("input", () => {
    txtMsg.style.height = "auto";
    txtMsg.style.height = Math.min(txtMsg.scrollHeight, 120) + "px";
  });
  btnPJ.onclick = choisirPieceJointe;
  fichierMsg.onchange = () => envoyerDepuis(fichierMsg);
  fichierCam.onchange = () => envoyerDepuis(fichierCam);
  fichierDoc.onchange = envoyerDocument;
  /* v28 : les 500 messages les plus RÉCENTS seulement (ordre inversé ensuite) —
     un téléphone reste rapide même après des mois de discussion */
  const { data: msgs, error: errMsgs } = await sb.from("messages").select("*")
    .or("and(sender_id.eq." + user.id + ",receiver_id.eq." + partenaire.id + "),and(sender_id.eq." + partenaire.id + ",receiver_id.eq." + user.id + ")")
    .order("created_at", { ascending: false }).limit(500);
  const zone = document.getElementById("zoneMsgs");
  if (!zone) return;
  if (errMsgs) {
    zone.innerHTML = `<p style="color:var(--erreur);font-size:13px;text-align:center">Impossible de charger l'historique — ${erreurFrancaise(errMsgs)}<br>Mais tu peux quand même écrire ci-dessous.</p>`;
    return;
  }
  zone.innerHTML = "";
  (msgs || []).reverse().forEach(ajouterBulle);
  defilerBas();
  marquerLu(partenaire.id);
}

/* ---------- Choix de la pièce jointe ---------- */

  const v = document.createElement("div");
  v.className = "voile";
  v.innerHTML = `
    <div class="popup">
      <h2 style="margin-bottom:2px">Joindre un fichier</h2>

      <button id="cDoc" class="secondaire">Document PDF (max 10 Mo)</button>

    </div>`;
  document.body.appendChild(v);

function ajouterBulle(m) {
  const zone = document.getElementById("zoneMsgs");
  if (!zone) return;
  const div = document.createElement("div");
  div.className = "bulle " + (m.sender_id === user.id ? "moi" : "autre");
  const h = new Date(m.created_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  let c = "";
  if (m.media_type === "image" && m.media_url) c += `<img src="${m.media_url}">`;
  if (m.media_type === "file" && m.media_url) {
    const nom = (m.content || "Document").replace(/</g, "&lt;");
    c += `<a class="docLien" href="${m.media_url}" target="_blank" rel="noopener">${nom}</a>`;
  }
  if (m.content && m.media_type !== "file") c += `<div>${m.content.replace(/</g, "&lt;")}</div>`;
  /* v30.4 : ✓ = envoyé, ✓✓ = lu (sur MES bulles uniquement) */
  if (m.sender_id === user.id) c += `<div class="heure">${h}<span class="etatLu${m.lu ? " lu" : ""}">${m.lu ? "✓✓" : "✓"}</span></div>`;
  else c += `<div class="heure">${h}</div>`;
  div.innerHTML = c;
  const im = div.querySelector("img");
  if (im && m.media_url) { im.className = "clicPhoto"; im.onclick = () => zoomPhoto(m.media_url); }
  zone.appendChild(div);
}

function defilerBas() {
  const zone = document.getElementById("zoneMsgs");
  if (zone) zone.scrollTop = zone.scrollHeight;
}

/* v27 : au retour sur l'app, on récupère les messages manqués (le temps réel
   peut dormir quand le téléphone met Tsiky en arrière-plan) */
async function rafraichirConversation() {
  if (!user || !partenaireActuel || envoiEnCours) return;
  const zone = document.getElementById("zoneMsgs");
  if (!zone || !document.getElementById("txtMsg")) return;
  const { data: msgs, error } = await sb.from("messages").select("*")
    .or("and(sender_id.eq." + user.id + ",receiver_id.eq." + partenaireActuel.id + "),and(sender_id.eq." + partenaireActuel.id + ",receiver_id.eq." + user.id + ")")
    .order("created_at", { ascending: false }).limit(500);
  if (error || !msgs) return;
  /* v30.4 : on redessine aussi quand un « lu » a changé (le nombre de
     bulles, lui, n'a pas bougé — d'où la signature longue) */
  const sig = msgs.length + ":" + msgs.filter(m => m.sender_id === user.id && m.lu).length;
  if (sig !== zone.dataset.sig) {
    zone.dataset.sig = sig;
    zone.innerHTML = "";
    msgs.reverse().forEach(ajouterBulle);
    defilerBas();
    marquerLu(partenaireActuel.id);
  }
}

async function envoyerTexte() {
  const txt = document.getElementById("txtMsg");
  const err = document.getElementById("errMsg");
  const contenu = txt.value.trim();
  if (!contenu || envoiEnCours || !partenaireActuel) return;
  envoiEnCours = true;
  try {
    txt.value = "";
    txt.style.height = "auto";
    const { data, error } = await sb.from("messages").insert({
      sender_id: user.id, receiver_id: partenaireActuel.id, content: contenu
    }).select().single();
    if (error) {
      txt.value = contenu; /* v27 : le texte tapé n'est jamais perdu */
      const m = (error.message || "").toLowerCase();
      err.textContent = (m.includes("row-level") || m.includes("policy"))
        ? "Impossible d'envoyer — ce contact t'a peut-être bloqué, ou ta session a expiré (déconnecte-toi puis reconnecte-toi)."
        : "Message : " + erreurFrancaise(error);
      return;
    }
    ajouterBulle(data);
    defilerBas();
    envoyerPush(partenaireActuel.id, { t: "msg", p: (monProfil && monProfil.pseudo) || "Un membre", b: contenu }); /* v30.4 */
  } finally { envoiEnCours = false; }
}

/* v30.3 : PHOTOS MULTIPLES — la galerie permet de choisir plusieurs photos
   d'un coup (5 maximum : au-delà, ça pèse sur les réseaux lents et les
   forfaits). Chaque photo part dans SA bulle, l'une après l'autre, avec un
   suivi lisible à chaque étape. Une photo qui échoue n'empêche PAS les
   suivantes : à la fin, le message dit exactement laquelle réessayer. */
const MAX_PHOTOS_ENVOI = 5;

async function envoyerDepuis(input) {
  const err = document.getElementById("errMsg");
  if (!input.files || !input.files.length || envoiEnCours || !partenaireActuel) return;
  const liste = Array.from(input.files).slice(0, MAX_PHOTOS_ENVOI);
  const ignorees = input.files.length - liste.length;
  envoiEnCours = true;
  const ratees = [];
  try {
    for (let i = 0; i < liste.length; i++) {
      const avant = "Photo " + (i + 1) + "/" + liste.length;
      try {
        if (err) err.textContent = avant + " — préparation…";
        let contenu = null;
        try { contenu = await compresserImage(liste[i], 800); }
        catch (e) { throw new Error(erreurFrancaise(e)); }
        const chemin = user.id + "/msg_" + Date.now() + "_" + i + ".jpg";
        const { error: errUp } = await uploaderFiable("fichiers", chemin, contenu, false, (n, s, pct) => { if (err) err.textContent = avant + " — " + txtEssai("envoi", n, s, pct); });
        if (errUp) throw new Error(erreurFrancaise(errUp));
        if (err) err.textContent = avant + " — enregistrement…";
        const url = sb.storage.from("fichiers").getPublicUrl(chemin).data.publicUrl;
        const { data, error } = await sb.from("messages").insert({
          sender_id: user.id, receiver_id: partenaireActuel.id, media_url: url, media_type: "image"
        }).select().single();
        if (error) throw new Error(erreurFrancaise(error));
        ajouterBulle(data);
        defilerBas();
        envoyerPush(partenaireActuel.id, { t: "msg", p: (monProfil && monProfil.pseudo) || "Un membre", b: "📷 Photo" }); /* v30.4 */
      } catch (e) {
        ratees.push("photo " + (i + 1) + " : " + ((e && e.message) || "erreur inconnue"));
      }
    }
    if (err) {
      if (ratees.length === 0) err.textContent = "";
      else err.textContent = "Pas " + (ratees.length > 1 ? "envoyées — " : "envoyée — ") + ratees.join(" · ") + ". Les autres sont bien parties : réessaie avec celle" + (ratees.length > 1 ? "s" : "") + "-là.";
    }
    if (ignorees > 0 && err) {
      err.textContent = "Maximum " + MAX_PHOTOS_ENVOI + " photos par envoi (" + ignorees + " ignorée" + (ignorees > 1 ? "s" : "") + "). " + err.textContent;
    }
  } finally { envoiEnCours = false; input.value = ""; }
}

async function envoyerDocument() {
  const input = document.getElementById("fichierDoc");
  const f = input.files[0];
  const err = document.getElementById("errMsg");
  if (!f || envoiEnCours || !partenaireActuel) return;
  envoiEnCours = true;
  try {
    if (f.size > 10 * 1024 * 1024) { if (err) err.textContent = "Fichier trop lourd — 10 Mo maximum."; return; }
    if (err) err.textContent = "Envoi du document…";
    /* v28 : plus d'espaces dans les noms — les liens des documents restent propres */
    const nomPropre = (f.name || "document.pdf").replace(/[^\w.\-()]/g, "_");
    const chemin = user.id + "/doc_" + Date.now() + "_" + nomPropre;
    const { error: errUp } = await uploaderFiable("fichiers", chemin, f, false, (n, s, pct) => { if (err) err.textContent = txtEssai("Envoi du document…", n, s, pct); });
    if (errUp) { if (err) err.textContent = "Document : " + erreurFrancaise(errUp); return; }
    if (err) err.textContent = "Enregistrement du message…";
    const url = sb.storage.from("fichiers").getPublicUrl(chemin).data.publicUrl;
    const { data, error } = await sb.from("messages").insert({
      sender_id: user.id, receiver_id: partenaireActuel.id, media_url: url, media_type: "file", content: f.name || "Document"
    }).select().single();
    if (error) { if (err) err.textContent = "Message : " + erreurFrancaise(error); return; }
    if (err) err.textContent = "";
    ajouterBulle(data);
    defilerBas();
    envoyerPush(partenaireActuel.id, { t: "msg", p: (monProfil && monProfil.pseudo) || "Un membre", b: "📄 " + (f.name || "Document") }); /* v30.4 */
  } finally { envoiEnCours = false; input.value = ""; }
}

/* ---------- Bandeaux pub (fenêtre inscription + nouvelle discussion) ---------- */
let cachePubs = null, cachePubsLe = 0;

async function chargerPubsFenetres() {
  if (cachePubs && Date.now() - cachePubsLe < 6 * 3600 * 1000) return cachePubs;
  const { data } = await sb.from("annonces").select("*").eq("actif", true)
    .order("created_at", { ascending: false });
  cachePubs = data || [];
  cachePubsLe = Date.now();
  return cachePubs;
}

function lienCorrect(l) {
  const l2 = (l || "").trim();
  if (!l2) return null;
  return /^https?:\/\//i.test(l2) ? l2 : "https://" + l2;
}

function contenuBandeauPub(a) {
  const lien = lienCorrect(a.lien);
  let c = "";
  if (a.image_url) c += `<div class="imgBanPub"><img src="${a.image_url}" alt="Publicité"></div>`;
  c += `<h3>${a.titre}</h3><p>${a.message}</p>`;
  if (lien) c += `<a class="btnLienPub" href="${lien}" target="_blank" rel="noopener">Découvrir</a>`;
  return `<div class="bannierePub">${c}</div>`;
}

/* Annonces d'un espace = celles marquées pour cet espace (+ "toutes" pour compat) */
function pubsPourEspace(pubs, espace) {
  return pubs.filter(a => a.emplacement === espace || a.emplacement === "toutes" || !a.emplacement);
}

async function remplirZonePub(idZone, espace, rang) {
  const zone = document.getElementById(idZone);
  if (!zone) return;
  const pubs = await chargerPubsFenetres();
  const liste = pubsPourEspace(pubs, espace);
  if (!liste.length) { zone.innerHTML = ""; zone.style.display = "none"; return; }
  const jour = Math.floor(Date.now() / 86400000);
  const a = liste[(jour + rang) % liste.length];
  zone.innerHTML = contenuBandeauPub(a);
  zone.style.display = "block";
}

/* ---------- Rafraîchit les bandeaux quand on revient sur l'app ---------- */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  rafraichirConversation(); /* v27 : on rattrape ce qui a été raté en arrière-plan */
  if (document.getElementById("pubAuth")) remplirZonePub("pubAuth", "inscription", 0);
  if (document.getElementById("pubNouveau")) remplirZonePub("pubNouveau", "nouveau", 1);
});

/* ---------- Popup pub (1 fois par jour max) ---------- */
async function verifierAnnonce() {
  const pubs = await chargerPubsFenetres();
  const liste = pubsPourEspace(pubs, "accueil");
  if (!liste.length) return;
  const jour = Math.floor(Date.now() / 86400000);
  const a = liste[jour % liste.length];
  const vu = JSON.parse(localStorage.getItem("tsiky_pub_vu") || "{}");
  if (vu.id === a.id && vu.jour === new Date().toDateString()) return;
  let lienOk = null;
  if (a.lien && a.lien.trim()) {
    lienOk = a.lien.trim();
    if (!/^https?:\/\//i.test(lienOk)) lienOk = "https://" + lienOk;
  }
  zonePopup.innerHTML = `
    <div class="voile">
      <div class="popup">
        <button class="croix" id="fermerPub">✕</button>
        ${a.image_url ? `<div class="imgPub"><img src="${a.image_url}"></div>` : ""}
        <h2>${a.titre}</h2>
        <p style="color:var(--texte);font-size:15px;margin:8px 0 12px">${a.message}</p>
        ${lienOk ? `<a class="btnLienPub" id="btnLien" href="${lienOk}" target="_blank" rel="noopener">Découvrir</a>` : ""}
      </div>
    </div>`;
  fermerPub.onclick = () => {
    zonePopup.innerHTML = "";
    localStorage.setItem("tsiky_pub_vu", JSON.stringify({ id: a.id, jour: new Date().toDateString() }));
  };
}

    </select>

    <p class="erreur" id="err"></p>
    <p class="info" id="ok"></p>
    <h2>Annonces existantes</h2>
    <div id="liste"><p style="color:var(--texte2);font-size:14px">Chargement…</p></div>
    <button id="retour" class="secondaire">← Retour</button>`;
  btnPublier.onclick = publierAnnonce;
  btnResetMdp.onclick = fenetreResetMdp;
  retour.onclick = () => accueil(monProfil);
  chargerListe();
}

/* ---------- v30.1 : réinitialiser le mot de passe d'un membre ----------
   Le mot de passe d'un AUTRE compte ne se change jamais depuis le navigateur
   (règle de sécurité Supabase). Tsiky appelle donc une petite fonction
   stockée DANS la base Supabase : reinit_mot_de_passe. Elle reconnaît
   l'admin toute seule (profil role = admin) — zéro code secret à retenir,
   zéro serveur à déployer. Installée UNE fois par Binou : SQL Editor →
   coller le bloc fourni avec la v30.1 → Run. */
function fenetreResetMdp() {
  const v = document.createElement("div");
  v.className = "voile";
  v.innerHTML = `
    <div class="popup" style="text-align:left">
      <button class="croix" id="rmFermer">✕</button>
      <h2 style="margin-bottom:4px">Mot de passe oublié d'un membre</h2>
      <p style="font-size:13px;color:var(--texte2);margin-bottom:4px">Il repart avec un mot de passe temporaire — il le changera ensuite depuis l'accueil.</p>
      <label>Numéro du membre</label>
      <input id="rmNum" type="tel" placeholder="034 00 000 00">
      <label>Nouveau mot de passe temporaire</label>
      <input id="rmMdp" placeholder="6 caractères minimum">
      <button id="rmProposer" class="secondaire" style="margin-top:8px">Proposer un mot de passe</button>
      <button id="rmOk">Changer le mot de passe</button>
      <p class="erreur" id="rmErr"></p>
      <p class="info" id="rmOk2"></p>
    </div>`;
  document.body.appendChild(v);
  document.getElementById("rmFermer").onclick = () => v.remove();
  document.getElementById("rmProposer").onclick = () => {
    document.getElementById("rmMdp").value = "tsiky" + Math.floor(1000 + Math.random() * 9000);
  };
  document.getElementById("rmOk").onclick = async () => {
    const err = document.getElementById("rmErr");
    const zoneOk = document.getElementById("rmOk2");
    zoneOk.textContent = ""; err.textContent = "";
    const num = normaliserNumero(document.getElementById("rmNum").value);
    const mdp = document.getElementById("rmMdp").value;
    if (!num) { err.textContent = "Numéro invalide. Exemple : 034 00 000 00"; return; }
    if (mdp.length < 6) { err.textContent = "Mot de passe : 6 caractères minimum."; return; }
    err.textContent = "Demande au serveur…";
    const { data, error } = await sb.rpc("reinit_mot_de_passe", { numero_cible: num, nouveau_mdp: mdp });
    if (error) {
      err.textContent = (error.code === "PGRST202" || /could not find the function/i.test(error.message || ""))
        ? "La commande n'est pas encore installée côté base : colle le bloc SQL dans Supabase (SQL Editor → Run), puis réessaie."
        : erreurFrancaise(error);
      return;
    }
    err.textContent = "";
    zoneOk.textContent = "✅ Mot de passe changé pour " + num + " ! Dis-le bien à " + (data || "membre") + ".";
  };
}

async function publierAnnonce() {
  const err = document.getElementById("err");
  const titre = aTitre.value.trim(), message = aMessage.value.trim();
  if (!titre || !message) { err.textContent = "Titre et message obligatoires."; return; }
  err.textContent = "Preparation…";
  let image_url = null;
  if (aImage.files[0]) {
    err.textContent = "Compression de l'image…";
    let imageCompacte = null;
    try { imageCompacte = await compresserImage(aImage.files[0], 600); }
    catch (e) { err.textContent = erreurFrancaise(e); return; }
    const chemin = `${user.id}/annonce_${Date.now()}.jpg`;
    const { error: errUp } = await uploaderFiable("pubs", chemin, imageCompacte, true, (n, s, pct) => { err.textContent = txtEssai("Envoi de l'image…", n, s, pct); });
    if (errUp) { err.textContent = "Image : " + erreurFrancaise(errUp) + " — vérifie ta connexion puis réessaie."; return; }
    image_url = sb.storage.from("pubs").getPublicUrl(chemin).data.publicUrl;
  }
  err.textContent = "Enregistrement…";
  const { error } = await sb.from("annonces").insert({
    titre, message, image_url, lien: aLien.value.trim() || null, emplacement: aEmpl.value
  });
  if (error) { err.textContent = erreurFrancaise(error); return; }
  cachePubs = null; cachePubsLe = 0;
  document.getElementById("ok").textContent = "Annonce publiée";
  err.textContent = "";
  aTitre.value = ""; aMessage.value = ""; aLien.value = ""; aImage.value = "";
  chargerListe();
}

async function chargerListe() {
  cachePubs = null; cachePubsLe = 0;
  const { data, error } = await sb.from("annonces").select("*").order("created_at", { ascending: false });
  if (error) {
    liste.innerHTML = `<p style="color:var(--erreur);font-size:14px">Impossible de charger les annonces : ${erreurFrancaise(error)}</p>`;
    return;
  }
  liste.innerHTML = data?.length ? "" : `<p style="color:var(--texte2);font-size:14px">Aucune annonce pour l'instant.</p>`;
  data?.forEach(a => {
    const div = document.createElement("div");
    div.className = "annonce";
    const optionsEspace = ["accueil", "inscription", "nouveau", "toutes"]
      .map(e => `<option value="${e}" ${a.emplacement === e ? "selected" : ""}>${NOMS_EMPLACEMENTS[e]}</option>`).join("");
    div.innerHTML = `
      <h3>${a.titre}</h3>
      <p>${a.message}</p>
      <div class="ligne">
        <span class="badge ${a.actif ? "on" : "off"}">${a.actif ? "ACTIVE" : "MASQUÉE"}</span>
        <span class="badge" style="background:var(--secondaire);color:var(--texte)">${NOMS_EMPLACEMENTS[a.emplacement] || "Partout"}</span>
        <button class="mini secondaire" id="tg-${a.id}">${a.actif ? "Masquer" : "Activer"}</button>
        <button class="mini secondaire" id="del-${a.id}">🗑️</button>
      </div>
      <div class="ligne" style="margin-top:8px;align-items:center">
        <span style="font-size:12px;color:var(--texte2)">Emplacement :</span>
        <select id="empl-${a.id}" style="font-size:12px;padding:5px 6px;max-width:170px">${optionsEspace}</select>
      </div>`;
    liste.appendChild(div);
    document.getElementById("tg-" + a.id).onclick = async () => {
      await sb.from("annonces").update({ actif: !a.actif }).eq("id", a.id);
      chargerListe();
    };
    document.getElementById("del-" + a.id).onclick = async () => {
      if (confirm("Supprimer cette annonce ?")) { await sb.from("annonces").delete().eq("id", a.id); chargerListe(); }
    };
    document.getElementById("empl-" + a.id).onchange = async (e) => {
      await sb.from("annonces").update({ emplacement: e.target.value }).eq("id", a.id);
      cachePubs = null; cachePubsLe = 0;
      chargerListe();
    };
  });
}

/* ---------- Diagnostic réseau (v28) ----------
   Le bouton « Diagnostic » en bas teste chaque étage, un par un, et dit en clair
   où ça bloque : connexion internet → serveur → stockage → VRAI envoi de 5 Ko.
   En cas de souci, une capture d'écran de ce test suffit à localiser le problème
   (à envoyer au développeur via « Contact »). */
async function lancerDiagnostic() {
  const ancien = document.getElementById("popDiag");
  if (ancien) ancien.remove();
  const v = document.createElement("div");
  v.className = "voile";
  v.id = "popDiag";
  v.innerHTML = `
    <div class="popup" style="text-align:left">
      <button class="croix" id="dgFermer">✕</button>
      <h2 style="margin-bottom:2px">Diagnostic</h2>
      <p style="font-size:13px;color:var(--texte2);margin-bottom:8px">Test en cours, un instant…</p>
      <div id="dgListe" style="font-size:14px;line-height:2"></div>
      <p style="font-size:12px;color:var(--texte2);margin-top:8px">Si une ligne est rouge, envoie sa capture d'écran au développeur via « Contact ».</p>
    </div>`;
  document.body.appendChild(v);
  document.getElementById("dgFermer").onclick = () => v.remove();
  const liste = document.getElementById("dgListe");
  const ligne = (ok, texte) => {
    const p = document.createElement("div");
    p.style.color = ok ? "var(--ok)" : "var(--erreur)";
    p.textContent = (ok ? "✓ " : "✗ ") + texte;
    liste.appendChild(p);
  };
  const attente = (texte) => {
    const p = document.createElement("div");
    p.style.color = "var(--texte2)";
    p.textContent = "… " + texte;
    liste.appendChild(p);
    return p;
  };
  const info = (texte) => {
    const p = document.createElement("div");
    p.style.color = "var(--texte2)";
    p.style.fontSize = "13px";
    p.textContent = texte;
    liste.appendChild(p);
  };
  ligne(navigator.onLine, navigator.onLine ? "Connexion internet active" : "Pas de connexion internet (mode avion ?)");
  const a1 = attente("Serveur Supabase…");
  const t1 = Date.now();
  try {
    await fetchFiable(SUPABASE_URL + "/rest/v1/", { headers: { apikey: SUPABASE_KEY } });
    a1.remove();
    ligne(true, "Serveur joignable (" + Math.round(Date.now() - t1) + " ms)");
  } catch (e) {
    a1.remove();
    ligne(false, "Serveur injoignable — " + erreurFrancaise(e));
    return;
  }
  const a2 = attente("Stockage des fichiers…");
  const t2 = Date.now();
  try {
    await fetchFiable(SUPABASE_URL + "/storage/v1/object/public/avatars/_test_" + Date.now());
    a2.remove();
    ligne(true, "Stockage joignable (" + Math.round(Date.now() - t2) + " ms)");
  } catch (e) {
    a2.remove();
    ligne(false, "Stockage injoignable — " + erreurFrancaise(e));
    return;
  }
  if (!user) {
    info("Connecte-toi puis relance le Diagnostic pour tester aussi l'envoi réel.");
    return;
  }
  const a3 = attente("Test d'envoi d'un petit fichier…");
  const cheminTest = user.id + "/test-reseau-" + Date.now() + ".txt";
  const t3 = Date.now();
  const { error: errTest } = await uploadAvecDelai("fichiers", cheminTest, new Blob(["test tsiky"], { type: "text/plain" }), false, null);
  if (errTest) {
    a3.remove();
    ligne(false, "ENVOI BLOQUÉ — " + erreurFrancaise(errTest));
    return;
  }
  a3.remove();
  ligne(true, "Envoi réussi (" + Math.round(Date.now() - t3) + " ms) — tes envois peuvent passer");
  sb.storage.from("fichiers").remove([cheminTest]); /* nettoyage — sans gravité si raté */
}
document.getElementById("lienDiag").onclick = lancerDiagnostic;

/* ---------- Service worker + MISE À JOUR AUTOMATIQUE (v27) ----------
   AVANT : une nouvelle version ne s'affichait qu'après DEUX rechargements
   manuels (cache du service worker) — beaucoup testaient sans le savoir
   l'ancienne version. MAINTENANT : dès qu'une nouvelle version prend le
   contrôle, l'app se recharge toute seule, une seule fois. */
let rechargementDejaFait = false;
let controleAuDepart = false;
let regSw = null;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then((r) => { regSw = r; }).catch(() => {});
  controleAuDepart = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!controleAuDepart) { controleAuDepart = true; return; } /* première installation : rien à recharger */
    if (rechargementDejaFait) return;
    rechargementDejaFait = true;
    location.reload();
  });
}
/* v28 : vérification de nouvelle version au retour sur l'app + chaque minute —
   même laissée ouverte des heures, l'app se met à jour toute seule. GitHub Pages
   garde les fichiers 10 min en cache : update() contourne ce cache. Et JAMAIS
   de vérification pendant un envoi en cours (un rechargement le casserait). */
setInterval(() => {
  if (regSw && !envoiEnCours) regSw.update().catch(() => {});
}, 60000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && regSw && !envoiEnCours) regSw.update().catch(() => {});
});

/* ---------- Bannière d'installation ---------- */
let installationDifferee = null;
const dejaInstallee = () => window.matchMedia("(display-mode: standalone)").matches
  || localStorage.getItem("tsiky_installee") === "1";

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  installationDifferee = e;
  afficherBanniereInstall();
});

window.addEventListener("appinstalled", () => {
  installationDifferee = null;
  localStorage.setItem("tsiky_installee", "1");
  const b = document.getElementById("banniereInstall");
  if (b) b.remove();
});

function banniereRefusee() {
  const j = localStorage.getItem("tsiky_ban_cache");
  return j && (Date.now() - parseInt(j)) < 7 * 24 * 3600 * 1000;
}

function afficherBanniereInstall() {
  if (!installationDifferee || dejaInstallee() || banniereRefusee()) return;
  if (!app || document.getElementById("banniereInstall")) return;
  const b = document.createElement("div");
  b.id = "banniereInstall";
  b.innerHTML = `<div class="txt">Ajoute Tsiky à ton écran d'accueil</div>`;
  const btn = document.createElement("button");
  btn.textContent = "Installer";
  btn.onclick = async () => {
    installationDifferee.prompt();
    await installationDifferee.userChoice;
    installationDifferee = null;
    b.remove();
  };
  const x = document.createElement("button");
  x.className = "croixBan";
  x.textContent = "✕";
  x.onclick = () => {
    b.remove();
    localStorage.setItem("tsiky_ban_cache", String(Date.now()));
  };
  b.appendChild(btn);
  b.appendChild(x);
  app.prepend(b);
}

new MutationObserver(() => afficherBanniereInstall())
  .observe(app, { childList: true });
</script>
