/* ---------- Outils ---------- */
function normaliserNumero(brut) {
  let n = (brut || "").replace(/[\s.\-()]/g, "");
  if (n.startsWith("+261")) n = n.slice(1);
  else if (n.startsWith("0")) n = "261" + n.slice(1);
  return /^261\d{9}$/.test(n) ? "+" + n : null;
}
const emailInvisible = (num) => num.replace("+", "") + "@tsiky.mg";
const numeroDepuisCompte = () => "+" + (user.email || "").split("@")[0];

function compresserImage(fichier, max = 400) {
  return new Promise((resolve) => {
    const timer = setTimeout(() => resolve(fichier), 8000);
    const img = new Image();
    img.onload = () => {
      clearTimeout(timer);
      try {
        const e = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = img.width * e; c.height = img.height * e;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? resolve(b) : resolve(fichier), "image/jpeg", 0.8);
      } catch (e2) { clearTimeout(timer); resolve(fichier); }
    };
    img.onerror = () => { clearTimeout(timer); resolve(fichier); };
    img.src = URL.createObjectURL(fichier);
  });
}

/* ---------- Sonnerie + vibration ---------- */
function jouerAlerte() {
  try { if (navigator.vibrate) navigator.vibrate(150); } catch (e) {}
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.setValueAtTime(1175, ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
    o.start(); o.stop(ctx.currentTime + 0.45);
  } catch (e) {}
}

    const vu = localStorage.getItem("tsiky_vu_" + m.sender_id);
    if (!vu || new Date(m.created_at) > new Date(vu)) n[m.sender_id] = (n[m.sender_id] || 0) + 1;
  });
  nonLus = n;
  mettreAJourBadges();
}

function afficherAuth() {

async function lancerAuth(inscription) {
  const err = document.getElementById("err");
  err.textContent = "";
  const numero = normaliserNumero(document.getElementById("numero").value);
  const mdp = document.getElementById("mdp").value;
  if (!numero) { err.textContent = "Numéro invalide. Exemple : 034 00 000 00"; return; }
  if (mdp.length < 6) { err.textContent = "Mot de passe : 6 caractères minimum."; return; }
  err.textContent = "Un instant…";
  const { error } = inscription
    ? await sb.auth.signUp({ email: emailInvisible(numero), password: mdp })
    : await sb.auth.signInWithPassword({ email: emailInvisible(numero), password: mdp });
  if (error) {
    err.textContent = error.message.includes("Invalid login credentials")
      ? "Numéro ou mot de passe incorrect."
      : error.message.includes("already")
      ? "Ce numéro a déjà un compte. Utilise « J'ai déjà un compte »."
      : error.message;
    return;
  }
  const { data } = await sb.auth.getSession();
  user = data.session?.user;
  apresConnexion();
}

  canal = sb.channel("tsiky-live")
    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "messages", filter: "receiver_id=eq." + user.id },
      (p) => {
        const m = p.new;
        if (partenaireActuel && m.sender_id === partenaireActuel.id) {
          ajouterBulle(m);
          defilerBas();
          marquerLu(m.sender_id);
        } else {
          nonLus[m.sender_id] = (nonLus[m.sender_id] || 0) + 1;
          jouerAlerte();
          mettreAJourBadges();
          if (document.getElementById("listeDisc")) afficherDiscussions();
        }
      })
    .subscribe();
}

function afficherPartage() {
  const v = document.createElement("div");
  v.className = "voile";
  v.innerHTML = `
    <div class="popup">
      <button class="croix" id="pFermer">✕</button>

      <div class="lienApp">${URL_APP}</div>
      <button id="pCopier">Copier le lien</button>
      <button id="pEnvoyer" class="secondaire">Envoyer le lien</button>
      <button id="pQuitter" class="secondaire">Fermer</button>
    </div>`;
  document.body.appendChild(v);
  document.getElementById("pFermer").onclick = () => v.remove();
  document.getElementById("pQuitter").onclick = () => v.remove();

  if (typeof QRCode !== "undefined") {
    new QRCode(document.getElementById("qrBox"), {
      text: URL_APP, width: 240, height: 240,
      colorDark: "#0f172a", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    document.getElementById("qrBox").innerHTML = `<p style="font-size:13px;color:var(--erreur)">QR indisponible — copie le lien ci-dessous.</p>`;
  }

    try {
      await navigator.clipboard.writeText(URL_APP);
      document.getElementById("pCopier").textContent = "Copié !";

      prompt("Copie ce lien :", URL_APP);
    }
    setTimeout(() => document.getElementById("pCopier").textContent = "Copier le lien", 2000);
  };

  document.getElementById("pEnvoyer").onclick = async () => {
    const texte = "Rejoins-moi sur Tsiky, le chat léger de Madagascar ! " + URL_APP;
    if (navigator.share) {
      try { await navigator.share({ title: "Tsiky", text: texte, url: URL_APP }); } catch (e) {}
    } else {
      window.open("https://wa.me/?text=" + encodeURIComponent(texte), "_blank");

async function ouvrirConversation(partenaire) {

  const { data: bloc } = await sb.from("blocks").select("*")

  app.innerHTML = `

      ${partenaire.avatar_url ? `<img src="${partenaire.avatar_url}">` : `<span class="rond-p">${partenaire.pseudo[0].toUpperCase()}</span>`}
      <span class="nom">${partenaire.pseudo}</span>
      <button class="btnBloc" id="btnBloc" title="Bloquer">${bloque ? "✅" : "🚫"}</button>
    </div>
    <div class="zone-msgs" id="zoneMsgs"><p style="color:var(--texte2);font-size:13px;text-align:center">Chargement…</p></div>
    ${bloque
      ? `<p class="erreur">Tu as bloqué ce contact. Débloque-le (bouton vert) pour discuter.</p>`
      : `<div class="barre-envoi">
          <input id="txtMsg" placeholder="Écris ton message…">
          <button id="btnPJ" title="Joindre">📎</button>
          <button id="btnEnvoyer">➤</button>
        </div>
        <input type="file" id="fichierMsg" accept="image/*" hidden>

        <input type="file" id="fichierDoc" accept="application/pdf,.pdf" hidden>
        <p class="erreur" id="errMsg"></p>`}`;
  retourDisc.onclick = afficherDiscussions;
  btnBloc.onclick = async () => {
    if (bloque) {
      await sb.from("blocks").delete().eq("blocker_id", user.id).eq("blocked_id", partenaire.id);
    } else {
      if (!confirm("Bloquer " + partenaire.pseudo + " ? Il ne pourra plus t'écrire.")) return;
      await sb.from("blocks").insert({ blocker_id: user.id, blocked_id: partenaire.id });
    }
    ouvrirConversation(partenaire);
  };
  if (bloque) return;
  const { data: msgs } = await sb.from("messages").select("*")
    .or("and(sender_id.eq." + user.id + ",receiver_id.eq." + partenaire.id + "),and(sender_id.eq." + partenaire.id + ",receiver_id.eq." + user.id + ")")
    .order("created_at");
  document.getElementById("zoneMsgs").innerHTML = "";
  (msgs || []).forEach(ajouterBulle);

  txtMsg.addEventListener("keydown", e => { if (e.key === "Enter") envoyerTexte(); });

  fichierCam.onchange = () => envoyerDepuis(fichierCam);
  fichierDoc.onchange = envoyerDocument;
}

function ajouterBulle(m) {
  const zone = document.getElementById("zoneMsgs");
  if (!zone) return;
  const div = document.createElement("div");
  div.className = "bulle " + (m.sender_id === user.id ? "moi" : "autre");
  const h = new Date(m.created_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  let c = "";
  if (m.media_type === "image" && m.media_url) c += `<img src="${m.media_url}">`;
  if (m.media_type === "file" && m.media_url) {
    const nom = (m.content || "Document").replace(/</g, "&lt;");
    c += `<a class="docLien" href="${m.media_url}" target="_blank" rel="noopener">${nom}</a>`;
  }
  if (m.content && m.media_type !== "file") c += `<div>${m.content.replace(/</g, "&lt;")}</div>`;
  c += `<div class="heure">${h}</div>`;
  div.innerHTML = c;
  zone.appendChild(div);
}

function defilerBas() {
  const zone = document.getElementById("zoneMsgs");
  if (zone) zone.scrollTop = zone.scrollHeight;
}

async function envoyerTexte() {
  const txt = document.getElementById("txtMsg");
  const err = document.getElementById("errMsg");
  const contenu = txt.value.trim();
  if (!contenu) return;
  txt.value = "";
  const { data, error } = await sb.from("messages").insert({
    sender_id: user.id, receiver_id: partenaireActuel.id, content: contenu
  }).select().single();
  if (error) { err.textContent = "Impossible d'envoyer — ce contact t'a peut-être bloqué."; return; }
  ajouterBulle(data);
  defilerBas();
}

async function envoyerDepuis(input) {
  const f = input.files[0];
  const err = document.getElementById("errMsg");
  if (!f) return;
  if (err) err.textContent = "Envoi de la photo…";
  const chemin = user.id + "/msg_" + Date.now() + ".jpg";
  const { error: errUp } = await sb.storage.from("fichiers")
    .upload(chemin, await compresserImage(f, 800));
  if (errUp) { if (err) err.textContent = "Photo : " + errUp.message; return; }
  const url = sb.storage.from("fichiers").getPublicUrl(chemin).data.publicUrl;
  const { data, error } = await sb.from("messages").insert({
    sender_id: user.id, receiver_id: partenaireActuel.id, media_url: url, media_type: "image"
  }).select().single();
  if (error) { if (err) err.textContent = "Impossible d'envoyer."; return; }
  input.value = "";
  if (err) err.textContent = "";
  ajouterBulle(data);
  defilerBas();
}

async function envoyerDocument() {
  const input = document.getElementById("fichierDoc");
  const f = input.files[0];
  const err = document.getElementById("errMsg");
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) { if (err) err.textContent = "Fichier trop lourd — 10 Mo maximum."; input.value = ""; return; }
  if (err) err.textContent = "Envoi du document…";
  const nomPropre = (f.name || "document.pdf").replace(/[^\w.\-() ]/g, "_");
  const chemin = user.id + "/doc_" + Date.now() + "_" + nomPropre;
  const { error: errUp } = await sb.storage.from("fichiers").upload(chemin, f);
  if (errUp) { if (err) err.textContent = "Document : " + errUp.message; input.value = ""; return; }
  const url = sb.storage.from("fichiers").getPublicUrl(chemin).data.publicUrl;
  const { data, error } = await sb.from("messages").insert({
    sender_id: user.id, receiver_id: partenaireActuel.id, media_url: url, media_type: "file", content: f.name || "Document"
  }).select().single();
  if (error) { if (err) err.textContent = "Impossible d'envoyer."; input.value = ""; return; }
  input.value = "";
  if (err) err.textContent = "";
  ajouterBulle(data);
  defilerBas();
}

async function publierAnnonce() {

  const titre = aTitre.value.trim(), message = aMessage.value.trim();
  if (!titre || !message) { err.textContent = "Titre et message obligatoires."; return; }
  err.textContent = "Preparation…";
  let image_url = null;
  if (aImage.files[0]) {
    err.textContent = "Compression de l'image…";
    const imageCompacte = await compresserImage(aImage.files[0], 600);
    err.textContent = "Envoi de l'image (10-30 s, patiente)…";
    const chemin = `${user.id}/annonce_${Date.now()}.jpg`;
    const { error: errUp } = await sb.storage.from("pubs").upload(chemin, imageCompacte, { upsert: true });
    if (errUp) { err.textContent = "Image : " + errUp.message; return; }
    image_url = sb.storage.from("pubs").getPublicUrl(chemin).data.publicUrl;
  }
  err.textContent = "Enregistrement…";
  const { error } = await sb.from("annonces").insert({
    titre, message, image_url, lien: aLien.value.trim() || null, emplacement: aEmpl.value
  });
  if (error) { err.textContent = error.message; return; }
  document.getElementById("ok").textContent = "Annonce publiée";
  err.textContent = "";
  aTitre.value = ""; aMessage.value = ""; aLien.value = ""; aImage.value = "";
  chargerListe();
}

async function chargerListe() {
  const { data } = await sb.from("annonces").select("*").order("created_at", { ascending: false });
  liste.innerHTML = data?.length ? "" : `<p style="color:var(--texte2);font-size:14px">Aucune annonce pour l'instant.</p>`;
  data?.forEach(a => {
    const div = document.createElement("div");
    div.className = "annonce";
    div.innerHTML = `
      <h3>${a.titre}</h3>
      <p>${a.message}</p>
      <div class="ligne">
        <span class="badge ${a.actif ? "on" : "off"}">${a.actif ? "ACTIVE" : "MASQUÉE"}</span>
        <span class="badge" style="background:var(--secondaire);color:var(--texte)">${NOMS_EMPLACEMENTS[a.emplacement] || "Accueil"}</span>
        <button class="mini secondaire" id="tg-${a.id}">${a.actif ? "Masquer" : "Activer"}</button>
        <button class="mini secondaire" id="del-${a.id}">🗑️</button>
      </div>`;
    liste.appendChild(div);
    document.getElementById("tg-" + a.id).onclick = async () => {
      await sb.from("annonces").update({ actif: !a.actif }).eq("id", a.id);
      chargerListe();
    };
    document.getElementById("del-" + a.id).onclick = async () => {
      if (confirm("Supprimer cette annonce ?")) { await sb.from("annonces").delete().eq("id", a.id); chargerListe(); }
    };
  });
}

/* ---------- Service worker ---------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ---------- Bannière d'installation ---------- */
let installationDifferee = null;
const dejaInstallee = () => window.matchMedia("(display-mode: standalone)").matches
  || localStorage.getItem("tsiky_installee") === "1";

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  installationDifferee = e;
  afficherBanniereInstall();
});

window.addEventListener("appinstalled", () => {
  installationDifferee = null;
  localStorage.setItem("tsiky_installee", "1");
  const b = document.getElementById("banniereInstall");
  if (b) b.remove();
});

function banniereRefusee() {
  const j = localStorage.getItem("tsiky_ban_cache");
  return j && (Date.now() - parseInt(j)) < 7 * 24 * 3600 * 1000;
}

function afficherBanniereInstall() {
  if (!installationDifferee || dejaInstallee() || banniereRefusee()) return;
  if (!app || document.getElementById("banniereInstall")) return;
  const b = document.createElement("div");
  b.id = "banniereInstall";
  b.innerHTML = `<div class="txt">Ajoute Tsiky à ton écran d'accueil</div>`;
  const btn = document.createElement("button");
  btn.textContent = "Installer";
  btn.onclick = async () => {
    installationDifferee.prompt();
    await installationDifferee.userChoice;
    installationDifferee = null;
    b.remove();
  };
  const x = document.createElement("button");
  x.className = "croixBan";
  x.textContent = "✕";
  x.onclick = () => {
    b.remove();
    localStorage.setItem("tsiky_ban_cache", String(Date.now()));
  };
  b.appendChild(btn);
  b.appendChild(x);
  app.prepend(b);
}

new MutationObserver(() => afficherBanniereInstall())
  .observe(app, { childList: true });
</script>
